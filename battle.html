<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<link rel="manifest" href="manifest.json"/>
<title>Battle Arena — Tenfold Legends</title>
<script>
(function(){
  if (screen.orientation && screen.orientation.lock) {
    screen.orientation.lock('landscape').catch(function(){});
  }
})();
</script>
<link rel="stylesheet" href="style.css"/>
<style>
/* ── PAGE ── */
html,body{margin:0;padding:0;overflow:hidden;height:100%;background:#050510;}
.arena-page{display:flex;flex-direction:column;height:100vh;position:relative;}
/* Prevent iOS bounce / double-tap zoom in game */
html { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }

/* ── ROLL OVERLAY ── */
#roll-overlay{
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(0,0,0,.96);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
  z-index:9999;
}
.roll-title{font-family:'Cinzel',serif;font-size:1.8rem;font-weight:900;color:#f0c040;letter-spacing:6px;}
.roll-subtitle{font-size:.85rem;color:#8888aa;letter-spacing:3px;}
.roll-fighters{display:flex;align-items:center;gap:40px;margin:10px 0;}

/* Roll card */
.roll-card{
  width:160px;height:230px;border-radius:14px;
  border:2px solid rgba(240,192,64,.3);
  background:#0c0c1e;
  position:relative;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
}
.roll-portrait{
  position:absolute;top:0;left:0;width:100%;height:100%;
  object-fit:cover;object-position:top center;display:block;
}
.roll-card-overlay{
  position:relative;z-index:2;width:100%;
  background:linear-gradient(0deg,rgba(0,0,0,.95) 0%,rgba(0,0,0,.6) 60%,transparent 100%);
  padding:30px 8px 12px;text-align:center;
}
.roll-card-emoji{font-size:2rem;display:block;margin-bottom:3px;}
.roll-card-name{font-family:'Cinzel',serif;font-size:.95rem;font-weight:700;color:#f0c040;letter-spacing:1px;}
.roll-card-sub{font-size:.68rem;color:#8888aa;margin-top:3px;}

@keyframes rollSpin{
  0%{border-color:rgba(240,192,64,.1);}
  50%{border-color:#f0c040;box-shadow:0 0 28px rgba(240,192,64,.5);}
  100%{border-color:rgba(240,192,64,.1);}
}
.roll-card.spinning{animation:rollSpin .09s linear infinite;}
.roll-card.settled{border-color:#f0c040;box-shadow:0 0 36px rgba(240,192,64,.55);animation:none;}

.roll-vs{font-family:'Cinzel',serif;font-size:3rem;font-weight:900;color:#e94560;text-shadow:0 0 26px rgba(233,69,96,.8);}

.roll-map-wrap{text-align:center;}
.roll-map-label{font-size:.72rem;color:#8888aa;letter-spacing:2px;text-transform:uppercase;margin-bottom:4px;}
.roll-map-name{font-family:'Cinzel',serif;font-size:1.2rem;color:#f0c040;}
@keyframes mapSpin{0%{opacity:.2;}50%{opacity:1;}100%{opacity:.2;}}
.roll-map-name.spinning{animation:mapSpin .1s linear infinite;}

#roll-start-btn{
  margin-top:8px;padding:14px 40px;
  background:linear-gradient(135deg,#c8960c,#f0c040,#c8960c);
  color:#1a1000;font-family:'Cinzel',serif;font-weight:900;
  font-size:1rem;letter-spacing:3px;border:none;border-radius:8px;
  cursor:pointer;display:none;
  transition:transform .15s,box-shadow .15s;
}
#roll-start-btn:hover{transform:scale(1.05);box-shadow:0 0 28px rgba(240,192,64,.6);}

/* ── STAGE ── */
.arena-stage{position:relative;flex:1;min-height:0;overflow:hidden;}
.arena-bg{position:absolute;inset:0;background-size:cover;background-position:center;}
.arena-bg-overlay{position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.85) 0%,rgba(0,0,0,.05) 40%,rgba(0,0,0,.05) 60%,rgba(0,0,0,.6) 100%);}
.map-tag{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.75);border:1px solid rgba(240,192,64,.35);border-radius:20px;padding:4px 18px;font-family:'Cinzel',serif;font-size:.78rem;color:#f0c040;letter-spacing:2px;z-index:10;}

/* ── FIGHTERS ── */
.fighters-row{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:space-between;padding:0 60px 20px;pointer-events:none;}
.fighter{position:relative;display:flex;flex-direction:column;align-items:center;}
.fighter-sprite-wrap{position:relative;width:240px;height:300px;}
/* Facing direction is handled per-hero in JS via facesRight flag — no static override here */
.fighter-sprite{
  position:absolute;top:0;left:0;width:100%;height:100%;
  object-fit:contain;object-position:bottom center;
  filter:drop-shadow(0 8px 30px rgba(0,0,0,.95));display:block;
}
.fighter-sprite-fallback{
  position:absolute;top:0;left:0;width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
  font-size:7rem;filter:drop-shadow(0 6px 24px rgba(0,0,0,.9));
}

/* Shake applied to the wrap so it never conflicts with the sprite's scaleX flip */
@keyframes hitShake{0%{transform:translateX(0);}20%{transform:translateX(-16px);}40%{transform:translateX(16px);}60%{transform:translateX(-8px);}80%{transform:translateX(8px);}100%{transform:translateX(0);}}
.fighter-sprite-wrap.shake{animation:hitShake .35s ease;}

@keyframes dieFade{to{opacity:0;filter:grayscale(1) brightness(.2);}}
.fighter.player .fighter-sprite.dead{animation:dieFade 1.1s ease forwards;}
.fighter.enemy  .fighter-sprite.dead{animation:dieFade 1.1s ease forwards;}

@keyframes burnGlow{0%,100%{filter:drop-shadow(0 0 10px #ff4500);}50%{filter:drop-shadow(0 0 28px #ff4500) brightness(1.1);}}
@keyframes iceGlow{0%,100%{filter:brightness(.75) hue-rotate(185deg) drop-shadow(0 0 12px #00cfff);}50%{filter:brightness(.85) hue-rotate(185deg) drop-shadow(0 0 28px #00cfff);}}
.fighter-sprite.burning{animation:burnGlow .6s ease-in-out infinite;}
.fighter-sprite.frozen{animation:iceGlow .8s ease-in-out infinite;}

.frozen-overlay{position:absolute;inset:0;background:rgba(0,207,255,.18);border:2px solid rgba(0,207,255,.6);border-radius:8px;pointer-events:none;display:none;}
.frozen-overlay.active{display:block;}

/* ── SKILL FX ── */
.skill-fx{position:absolute;pointer-events:none;z-index:60;width:220px;height:220px;}
.skill-fx img{width:100%;height:100%;object-fit:contain;}
@keyframes impactPop{0%{transform:translate(-50%,-50%) scale(.1);opacity:1;}55%{transform:translate(-50%,-50%) scale(2.4);opacity:.9;}100%{transform:translate(-50%,-50%) scale(3);opacity:0;}}
.impact-burst{position:absolute;pointer-events:none;z-index:65;width:130px;height:130px;border-radius:50%;animation:impactPop .45s ease-out forwards;transform:translate(-50%,-50%);}
@keyframes dmgPop{0%{transform:translateX(-50%) translateY(0) scale(.5);opacity:1;}30%{transform:translateX(-50%) translateY(-40px) scale(1.4);}100%{transform:translateX(-50%) translateY(-100px) scale(.9);opacity:0;}}
.dmg-num{position:absolute;pointer-events:none;z-index:70;font-family:'Cinzel',serif;font-weight:900;font-size:2.6rem;text-shadow:0 2px 10px #000;animation:dmgPop 1.2s ease-out forwards;white-space:nowrap;left:50%;top:20%;}
.dmg-num.crit{font-size:3.2rem;color:#ffdd00!important;}
.dmg-num.heal{color:#44ff99!important;}
.dmg-num.mana-drain{color:#33aaff!important;font-size:1.9rem;}

/* ── HUD ── */
.hud-top{position:absolute;top:0;left:0;right:0;display:flex;flex-direction:column;align-items:stretch;padding:10px 14px;z-index:20;gap:4px;pointer-events:none;}
.hud-top > div:last-child{display:flex;gap:6px;pointer-events:all;}
.hud-box{background:rgba(4,4,12,.9);border:1px solid rgba(240,192,64,.2);border-radius:8px;padding:8px 12px;flex:1;pointer-events:all;}
.hud-box.enemy-box{text-align:right;}
.hud-hero-name{font-family:'Cinzel',serif;font-size:.9rem;font-weight:800;color:#f0c040;display:flex;align-items:center;gap:6px;}
.hud-box.enemy-box .hud-hero-name{justify-content:flex-end;}
.hud-lv{font-size:.68rem;color:#8888aa;font-family:'Rajdhani',sans-serif;}
.hud-bars{margin-top:5px;}
.hud-bar-row{display:flex;align-items:center;gap:6px;margin-bottom:4px;}
.hud-bar-label{font-size:.68rem;font-weight:700;color:#8888aa;width:26px;text-transform:uppercase;flex-shrink:0;}
.hud-bar-track{flex:1;height:9px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden;}
.hud-bar-fill{height:100%;border-radius:4px;transition:width .35s;}
.bar-hp{background:linear-gradient(90deg,#aa0000,#ff4444,#ff9999);}
.bar-mana{background:linear-gradient(90deg,#003399,#0077ff,#66bbff);}
.hud-bar-val{font-size:.72rem;font-weight:700;color:#e8e0d0;min-width:66px;text-align:right;}
.hud-box.enemy-box .hud-bar-row{flex-direction:row-reverse;}
.hud-box.enemy-box .hud-bar-val{text-align:left;}
.hud-box.your-turn{border-color:rgba(240,192,64,.7);box-shadow:0 0 18px rgba(240,192,64,.35);}
.hud-box.enemy-turn{border-color:rgba(233,69,96,.7);box-shadow:0 0 18px rgba(233,69,96,.35);}
.hud-vs{display:flex;flex-direction:row;align-items:center;justify-content:center;gap:8px;padding:2px 0;}
.vs-text{font-family:'Cinzel',serif;font-size:1.4rem;font-weight:900;color:#e94560;text-shadow:0 0 18px rgba(233,69,96,.7);line-height:1;}
.turn-text{font-size:.68rem;color:#8888aa;letter-spacing:2px;text-transform:uppercase;}
.status-badges{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap;}
.status-badge{font-size:.62rem;font-weight:700;padding:2px 6px;border-radius:12px;border:1px solid currentColor;}
.sb-burn{color:#ff4500;background:rgba(255,69,0,.12);}
.sb-freeze{color:#00cfff;background:rgba(0,207,255,.12);}
.sb-paralyzed{color:#ffe600;background:rgba(255,230,0,.12);}
.sb-guard{color:#c0c0c0;background:rgba(192,192,192,.12);}

/* ── CONTROLS ── */
.controls-wrap{flex-shrink:0;background:rgba(4,4,12,.97);border-top:1px solid rgba(240,192,64,.2);padding:10px 16px;display:flex;align-items:center;gap:14px;z-index:30;}
.skills-wrap{display:flex;gap:10px;align-items:flex-start;}
.skill-slot{display:flex;flex-direction:column;align-items:center;gap:3px;}
.skill-slot-label{font-size:.6rem;color:#8888aa;letter-spacing:1px;text-transform:uppercase;}

.skill-btn{
  position:relative;width:76px;height:76px;border-radius:10px;
  border:2px solid rgba(240,192,64,.3);cursor:pointer;
  overflow:hidden;background:rgba(0,0,0,.7);padding:0;flex-shrink:0;
  transition:all .18s;
}
.skill-btn:hover:not(:disabled){border-color:#f0c040;box-shadow:0 0 20px rgba(240,192,64,.5);transform:scale(1.08);}
.skill-btn:disabled{opacity:.35;cursor:not-allowed;}
.skill-btn.basic-s{border-color:rgba(160,160,160,.45);}
.skill-btn.special-s{border-color:rgba(60,130,255,.55);}
.skill-btn.ultimate-s{border-color:rgba(240,192,64,.7);box-shadow:0 0 12px rgba(240,192,64,.2);}
.skill-btn.story-locked{border-color:rgba(255,255,255,.12)!important;box-shadow:none!important;filter:grayscale(1) brightness(.55);cursor:not-allowed;}
.skill-lock-overlay{position:absolute;inset:0;background:rgba(0,0,0,.72);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:8px;z-index:7;pointer-events:none;}
.skill-lock-overlay span{font-size:1.3rem;line-height:1;}
.skill-lock-overlay small{font-size:.45rem;color:#ffcc55;font-weight:700;letter-spacing:.5px;text-align:center;line-height:1.3;padding:0 4px;}

/* Icon fills entire button */
.skill-btn .sk-icon{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;display:block;z-index:1;}
/* Fallback shown when no icon */
.skill-btn-fb{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:1.6rem;z-index:1;}
.skill-btn-fb small{font-size:.55rem;color:#f0c040;font-weight:700;}
/* Overlays sit above icon */
.skill-cd-overlay{position:absolute;inset:0;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;font-size:1.8rem;font-weight:900;color:#fff;border-radius:8px;z-index:5;}
.skill-key-hint{position:absolute;bottom:2px;right:4px;font-size:.62rem;font-weight:900;color:#f0c040;text-shadow:0 1px 3px #000;z-index:6;}
.skill-mana-cost{position:absolute;top:2px;left:4px;font-size:.6rem;font-weight:700;color:#66ccff;text-shadow:0 1px 3px #000;z-index:6;}
.skill-name-tag{font-size:.58rem;color:rgba(255,255,255,.55);text-align:center;max-width:76px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;}

.ctrl-divider{width:1px;height:62px;background:rgba(255,255,255,.08);flex-shrink:0;}
.battle-log{flex:1;max-width:380px;min-width:180px;height:76px;overflow-y:auto;padding:5px 10px;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.07);border-radius:6px;font-size:.76rem;line-height:1.6;}
.battle-log p{margin:0;}
.battle-log .lp{color:#f0c040;}
.battle-log .le{color:#ff8888;}
.battle-log .ls{color:#8888aa;font-style:italic;}
.battle-log .lh{color:#44ff99;}
.action-area{display:flex;flex-direction:column;gap:6px;flex-shrink:0;}
#btn-attack{padding:10px 22px;font-size:.9rem;letter-spacing:2px;}
.btn-auto{padding:10px 22px;font-size:.9rem;letter-spacing:2px;background:rgba(40,40,80,.85);border:1.5px solid rgba(100,100,200,.5);color:#8888cc;cursor:pointer;border-radius:6px;font-family:'Rajdhani',sans-serif;font-weight:700;text-transform:uppercase;transition:all .2s;}
.btn-auto:hover{border-color:#aaaaff;color:#ccccff;}
.btn-auto.active{background:linear-gradient(135deg,#1a1a6e,#2a2aaa);border-color:#7777ff;color:#ffffff;box-shadow:0 0 12px rgba(100,100,255,.6);animation:autoPulse 1.2s ease-in-out infinite;}
@keyframes autoPulse{0%,100%{box-shadow:0 0 8px rgba(100,100,255,.5);}50%{box-shadow:0 0 18px rgba(100,100,255,.9);}}
.btn-flee{padding:6px 18px;font-size:.78rem;background:transparent;border:1px solid rgba(255,255,255,.1);color:#8888aa;cursor:pointer;border-radius:4px;transition:all .2s;font-family:'Rajdhani',sans-serif;font-weight:600;letter-spacing:1px;text-transform:uppercase;}
.btn-flee:hover{border-color:#e94560;color:#e94560;}

/* ── RESULT OVERLAY ── */
#result-overlay{
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(0,0,0,.92);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:9998;opacity:0;pointer-events:none;transition:opacity .5s;
}
#result-overlay.show{opacity:1;pointer-events:all;}
@keyframes resultIn{from{transform:scale(.6) translateY(-30px);opacity:0;}to{transform:scale(1) translateY(0);opacity:1;}}
.result-box{animation:resultIn .5s cubic-bezier(.3,1.5,.5,1) forwards;text-align:center;}
.result-label{font-family:'Cinzel',serif;font-size:6rem;font-weight:900;line-height:1;letter-spacing:10px;}
.result-label.win{background:linear-gradient(135deg,#a06800,#f0c040,#fff8dc,#f0c040,#a06800);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.result-label.lose{background:linear-gradient(135deg,#600000,#e94560,#ff9090);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.result-sub{font-family:'Cinzel',serif;font-size:1rem;color:#8888aa;letter-spacing:5px;margin:6px 0 16px;}
.result-pts{font-family:'Cinzel',serif;font-size:1.5rem;color:#f0c040;margin-bottom:8px;}
.result-pts span{font-size:2.5rem;}
.result-hero-info{font-size:.85rem;color:#8888aa;margin-bottom:26px;letter-spacing:1px;}
.result-btns{display:flex;gap:14px;justify-content:center;}
.rbtn{padding:12px 28px;font-family:'Cinzel',serif;font-weight:700;letter-spacing:2px;font-size:.9rem;border:none;border-radius:6px;cursor:pointer;transition:all .2s;}
.rbtn.gold{background:linear-gradient(135deg,#c8960c,#f0c040);color:#1a1000;}
.rbtn.ghost{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);color:#e8e0d0;}
.rbtn:hover{transform:translateY(-2px);}

@keyframes lvlUp{0%{opacity:0;transform:translateX(-50%) scale(.5);}60%{opacity:1;transform:translateX(-50%) scale(1.2) translateY(-8px);}100%{opacity:0;transform:translateX(-50%) scale(1) translateY(-55px);}}
.lvl-up-notif{position:absolute;bottom:290px;left:50%;transform:translateX(-50%);font-family:'Cinzel',serif;font-size:1.3rem;color:#f0c040;text-shadow:0 0 20px #f0c040;white-space:nowrap;pointer-events:none;z-index:80;animation:lvlUp 1.8s ease forwards;}

/* ══ MOBILE OVERRIDES ══════════════════════════════════════ */

/* ── ROLL OVERLAY — mobile ── */
@media (max-width: 600px) {
  #roll-overlay { gap: 12px; padding: 20px 14px; justify-content: flex-start; padding-top: 40px; overflow-y: auto; }
  .roll-title { font-size: 1.2rem; letter-spacing: 3px; }
  .roll-subtitle { font-size: 0.75rem; letter-spacing: 2px; }
  .roll-fighters { gap: 16px; }
  .roll-card { width: 120px; height: 175px; border-radius: 10px; }
  .roll-vs { font-size: 2rem; }
  .roll-card-name { font-size: 0.82rem; }
  .roll-card-sub  { font-size: 0.6rem; }
  .roll-map-name  { font-size: 1rem; }
  #roll-start-btn { padding: 12px 28px; font-size: 0.88rem; letter-spacing: 2px; margin-top: 4px; }
}

@media (max-width: 400px) {
  .roll-card { width: 100px; height: 148px; }
  .roll-fighters { gap: 10px; }
  .roll-vs { font-size: 1.6rem; }
}

/* ── HUD — mobile: stack into 2-row layout ── */
@media (max-width: 700px) {
  .hud-top {
    flex-direction: column;
    gap: 0;
    padding: 6px 8px 4px;
  }
  /* Row 1: player box left, enemy box right, side by side */
  .hud-top { flex-wrap: wrap; }
  .hud-box      { min-width: 0; flex: 1; padding: 5px 8px; border-radius: 6px; }
  .hud-box.enemy-box { text-align: right; }
  .hud-vs       { order: -1; width: 100%; flex-direction: row;
                  justify-content: center; gap: 8px; padding: 0 0 4px; }
  .vs-text      { font-size: 1.1rem; }
  .turn-text    { font-size: 0.6rem; letter-spacing: 1px; }
  .hud-hero-name{ font-size: 0.75rem; }
  .hud-lv       { font-size: 0.6rem; }
  .hud-bar-row  { margin-bottom: 2px; }
  .hud-bar-track{ height: 7px; }
  .hud-bar-val  { font-size: 0.62rem; min-width: 52px; }
  .hud-bar-label{ font-size: 0.6rem; width: 22px; }
  .status-badges{ gap: 3px; margin-top: 2px; }
  .status-badge { font-size: 0.55rem; padding: 1px 4px; }
}

/* ── FIGHTERS — shrink sprites on mobile ── */
@media (max-width: 700px) {
  .fighters-row { padding: 0 16px 10px; }
  .fighter-sprite-wrap { width: 160px; height: 200px; }
}
@media (max-width: 480px) {
  .fighters-row { padding: 0 6px 8px; }
  .fighter-sprite-wrap { width: 120px; height: 155px; }
  .map-tag { font-size: 0.65rem; padding: 3px 12px; top: 8px; }
  .dmg-num { font-size: 1.8rem; }
  .dmg-num.crit { font-size: 2.2rem; }
}

/* ── CONTROLS — mobile: 2-row layout ── */
@media (max-width: 700px) {
  .controls-wrap {
    flex-wrap: wrap;
    padding: 8px 10px;
    gap: 8px;
  }
  /* Row 1: skill buttons fill the width */
  .skills-wrap {
    order: 1;
    width: 100%;
    justify-content: center;
    gap: 8px;
  }
  /* Row 2: log + action buttons side by side */
  .battle-log {
    order: 2;
    flex: 1;
    min-width: 0;
    max-width: none;
    height: 58px;
    font-size: 0.7rem;
  }
  .action-area {
    order: 2;
    flex-direction: row;
    gap: 6px;
    align-items: center;
  }
  #btn-attack { padding: 8px 14px; font-size: 0.8rem; letter-spacing: 1px; }
  .btn-auto   { padding: 8px 14px; font-size: 0.8rem; letter-spacing: 1px; }
  .btn-flee   { padding: 8px 12px; font-size: 0.72rem; }
  .ctrl-divider { display: none; }

  /* Skill buttons: larger touch target, equal size */
  .skill-btn { width: 68px; height: 68px; }
  .skill-slot-label { font-size: 0.55rem; }
  .skill-name-tag   { font-size: 0.52rem; max-width: 68px; }
  .skill-key-hint   { font-size: 0.55rem; }
  .skill-mana-cost  { font-size: 0.52rem; }
  .skill-cd-overlay { font-size: 1.4rem; }
}

@media (max-width: 420px) {
  .skill-btn { width: 60px; height: 60px; border-radius: 8px; }
  .skills-wrap { gap: 6px; }
  #btn-attack { padding: 7px 10px; font-size: 0.75rem; }

<script>
'use strict';

// ── MOBILE VIEWPORT HEIGHT FIX (iOS Safari address bar) ──────
function setVh() {
  document.documentElement.style.setProperty('--vh', window.innerHeight * 0.01 + 'px');
}
setVh();
window.addEventListener('resize', setVh);
// Apply to arena-page height via inline style when needed
document.addEventListener('DOMContentLoaded', () => {
  const page = document.querySelector('.arena-page');
  if (page) page.style.height = 'calc(var(--vh, 1vh) * 100)';
});

// ── PORTRAIT LOCK (battle page — blocking) ────────────────────
(function() {
  const prompt = document.getElementById('rotate-prompt');
  if (!prompt) return;

  function isMobile() {
    return window.innerWidth <= 900 || 'ontouchstart' in window;
  }
  function isPortrait() {
    if (screen.orientation && screen.orientation.type) {
      return screen.orientation.type.startsWith('portrait');
    }
    return window.innerHeight > window.innerWidth;
  }
  function checkOrientation() {
    if (isMobile() && isPortrait()) {
      prompt.classList.add('show');
      document.body.style.overflow = 'hidden';
    } else {
      prompt.classList.remove('show');
      document.body.style.overflow = '';
    }
  }

  // Fire immediately — no delay, no portrait flash
  checkOrientation();
  window.addEventListener('resize', checkOrientation);
  window.addEventListener('orientationchange', () => setTimeout(checkOrientation, 150));
  if (screen.orientation) {
    screen.orientation.addEventListener('change', () => setTimeout(checkOrientation, 150));
  }
})();

// ── AUTO LOGIN (no redirect on file://) ──────────────────────
Game.loadUser();
if (!Game.user) {
  Game.login({ userID:'demo', username:'Player', totalScore:0, sessionID:'local' });
}
const user = Game.user;

// Background sync only; battle startup never waits for the server.
Game.syncScore().then((score) => {
  if (score === null) return;
  user.totalScore = score;
  const nav = document.getElementById('nav-score');
  if (nav) nav.textContent = score;
  const navMobile = document.getElementById('nav-score-mobile');
  if (navMobile) navMobile.textContent = score;
});

// ── ENSURE HERO SELECTED ─────────────────────────────────────
(function() {
  let h = Game.getSelectedHero();
  if (!h || !HEROES[h]) {
    Game.selectHero('aeron');
  }
})();



// ── MAPS ─────────────────────────────────────────────────────
const MAPS = [
  { name:'Flame Sanctum',    bg:'Sprite/Aeron/1background.webp' },
  { name:'Ashen Wasteland',  bg:'Sprite/Aeron/2background.webp' },
  { name:'Inferno Forge',    bg:'Sprite/Aeron/3background.webp' },
  { name:'Phoenix Crater',   bg:'Sprite/Aeron/4background.webp' },
  { name:'Frozen Tundra',    bg:'Sprite/Lyra/background1.webp'  },
  { name:'Crystal Glacier',  bg:'Sprite/Lyra/background2.webp'  },
  { name:'Frostbite Valley', bg:'Sprite/Lyra/background3.webp'  },
  { name:'Thunder Plains',   bg:'Sprite/Kael/background1.webp'  },
  { name:'Storm Peak',       bg:'Sprite/Kael/background2.webp'  },
  { name:'Crumbled Canyon',  bg:'Sprite/Riven/background1.webp' },

  { name:'Sunken Temple',    bg:'Sprite/Mira/background3.webp'  },
  { name:'Ocean Abyss',      bg:'Sprite/Mira/background4.webp'  },
  { name:'Stormy Shores',    bg:'Sprite/Mira/background5.webp'  },
  { name:'Iron Fortress',    bg:'Sprite/Brutus/background1.webp'},
  { name:'Steel Ramparts',   bg:'Sprite/Brutus/background2.webp'},
  { name:'Siege Grounds',    bg:'Sprite/Brutus/background3.webp'},
  { name:'War Throne',       bg:'Sprite/Brutus/background4.webp'},
  { name:'Gale Peak',        bg:'Sprite/Orion/background1.webp' },
  { name:'Stormwind Ridge',  bg:'Sprite/Orion/background2.webp' },
  { name:'Tempest Hollow',   bg:'Sprite/Orion/background3.webp' },
  { name:'Arcane Sanctum',   bg:'Sprite/Elysia/background1.webp'},
  { name:'Celestial Spire',  bg:'Sprite/Elysia/background2.webp'},
  { name:'Starlight Realm',  bg:'Sprite/Elysia/background3.webp'},
];

// ── BATTLE STATE ─────────────────────────────────────────────
let B = {};
let rollPlayerHeroId, rollEnemyHeroId, rollMap;

// ── AUTO-BATTLE ───────────────────────────────────────────────
let autoPlay = false;

function toggleAuto() {
  autoPlay = !autoPlay;
  const btn = document.getElementById('btn-auto');
  if (btn) {
    btn.classList.toggle('active', autoPlay);
    btn.textContent = autoPlay ? '⏹ AUTO ON' : '▶ AUTO';
  }
  // If auto just turned ON and it's already the player's turn, act immediately
  if (autoPlay && !B.over && !B.locked && B.turn === 'player') {
    setTimeout(doAutoPlayerTurn, 300);
  }
}

// Mirror of pickEnemySkill() but for the player — uses same smart logic
function pickPlayerSkill() {
  const hp  = B.pHp / B.pMaxHp;
  const mp  = B.pMp;
  const rng = Math.random();

  // Read which skills are actually unlocked for the player
  const skillUL  = JSON.parse(safeLocalStorage.getItem('tenfold_skills_' + (Game.user && Game.user.userID || 'demo')) || '{}');
  const unlocked = Game.isAdmin() ? ['basic','special','ultimate'] : ((skillUL[B.playerHeroId]) || []);

  const canSpecial  = unlocked.includes('special')  && B.pCD.special  === 0 && mp >= (B.pHero.skills.special.manaCost  || 0);
  const canUltimate = unlocked.includes('ultimate') && B.pCD.ultimate === 0 && mp >= (B.pHero.skills.ultimate.manaCost || 0);
  const canBasic    = unlocked.includes('basic')    && B.pCD.basic    === 0 && mp >= (B.pHero.skills.basic.manaCost    || 0);

  // Ultimate — use when low HP or 35% chance
  if (canUltimate) {
    if (hp < 0.5 || rng < 0.35) return 'ultimate';
  }

  // Special — smart use based on skill type
  if (canSpecial) {
    const sp = B.pHero.skills.special;
    if (sp.damage < 0 && hp < 0.55) return 'special';   // heal when low HP
    if (sp.damage === 0 && rng < 0.4) return 'special';  // guard randomly
    if (sp.damage > 0  && rng < 0.60) return 'special';  // damage 60% chance
  }

  // Basic skill
  if (canBasic) return 'basic';

  // Fallback — plain attack
  return 'attack';
}

function doAutoPlayerTurn() {
  if (!autoPlay || B.over || B.locked || B.turn !== 'player') return;
  const choice = pickPlayerSkill();
  if (choice === 'attack') {
    useAttack();
  } else {
    useSkill(choice);
  }
}
