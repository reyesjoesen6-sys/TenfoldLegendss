const $ = id => document.getElementById(id);

// ── ENTITY HELPER — hero or story monster ────────────────────
function getEntity(id) {
  return HEROES[id] || STORY_ENEMIES[id] || null;
}

// ── INIT BATTLE STATE ────────────────────────────────────────
function initBattleState(pId, eId, mapObj, pLv, eLv) {
  const pH = getEntity(pId), eH = getEntity(eId);
  const pS = getScaledStats(pId, pLv), eS = getScaledStats(eId, eLv);
  B = {
    mode:    safeSessionStorage.getItem('tenfold_battle_mode')    || 'arena',
    chapter: +safeSessionStorage.getItem('tenfold_battle_chapter') || 0,
    stage:   +safeSessionStorage.getItem('tenfold_battle_stage')   || 0,
    playerHeroId:pId, enemyHeroId:eId, map:mapObj,
    pHero:pH, pMaxHp:pS.hp, pHp:pS.hp, pMaxMp:100, pMp:100,
    pAtk:pS.atk, pDef:pS.def, pSpd:pS.spd, pCrit:pS.crit, pLevel:pLv,
    pBurning:0, pFrozen:0, pParalyzed:0, pGuard:false, pBoost:0,
    pCD:{basic:0,special:0,ultimate:0},
    eHero:eH, eMaxHp:eS.hp, eHp:eS.hp, eMaxMp:100, eMp:100,
    eAtk:eS.atk, eDef:eS.def, eSpd:eS.spd, eCrit:eS.crit, eLevel:eLv,
    eBurning:0, eFrozen:0, eParalyzed:0, eGuard:false, eBoost:0,
    eCD:{basic:0,special:0,ultimate:0},
    turn:'player', over:false, turnCount:0, locked:false,
  };
}

// ── SPRITE FLIP HELPER ───────────────────────────────────────
// Player is on the LEFT  → needs to face RIGHT
// Enemy  is on the RIGHT → needs to face LEFT
// facesRight=true  → sprite naturally faces right
//   player: no flip (scaleX 1)   enemy: flip (scaleX -1)
// facesRight=false → sprite naturally faces left
//   player: flip (scaleX -1)     enemy: no flip (scaleX 1)
function getSpriteFlip(who, heroId, state) {
  const entity = getEntity(heroId);
  // Per-sprite flip override (e.g. ash_wolf has inconsistent sprite directions)
  if (entity && entity.flipStates && state && state in entity.flipStates) {
    const facesRight = entity.flipStates[state];
    if (who === 'player') return facesRight ?  1 : -1;
    else                  return facesRight ? -1 :  1;
  }
  const facesRight = entity ? entity.facesRight !== false : true;
  if (who === 'player') return facesRight ?  1 : -1;
  else                  return facesRight ? -1 :  1;
}

// ── BUILD FIGHTER SPRITE ─────────────────────────────────────
function buildSprite(who, heroId) {
  const wrapId = who === 'player' ? 'p-wrap' : 'e-wrap';
  const sprId  = who === 'player' ? 'p-sprite' : 'e-sprite';
  const wrap   = $(wrapId);
  const h      = getEntity(heroId);
  const frozen = wrap.querySelector('.frozen-overlay');

  wrap.querySelectorAll('.fighter-sprite,.fighter-sprite-fallback').forEach(el => el.remove());

  const idleSrc = h.sprites && h.sprites.idle;
  const flip    = getSpriteFlip(who, heroId, 'idle');
  if (idleSrc) {
    const img = document.createElement('img');
    img.className = 'fighter-sprite';
    img.id  = sprId;
    img.alt = h.name;
    img.src = idleSrc;
    img.style.transform = `scaleX(${flip})`;
    img.onerror = () => { img.remove(); addFallback(wrap, who, heroId, h, frozen, sprId); };
    wrap.insertBefore(img, frozen);
  } else {
    addFallback(wrap, who, heroId, h, frozen, sprId);
  }
}

function addFallback(wrap, who, heroId, h, frozen, sprId) {
  const fb = document.createElement('div');
  fb.className   = 'fighter-sprite-fallback';
  fb.id          = sprId;
  fb.textContent = ELEMENT_ICONS[h.element] || '⚔';
  fb.style.transform = `scaleX(${getSpriteFlip(who, heroId, 'idle')})`;
  wrap.insertBefore(fb, frozen);
}

function setSprite(who, state) {
  const heroId = who === 'player' ? B.playerHeroId : B.enemyHeroId;
  const h  = getEntity(heroId);
  const el = $(who === 'player' ? 'p-sprite' : 'e-sprite');
  if (!el || el.tagName !== 'IMG') return;
  const src = (h.sprites && h.sprites[state]) || (h.sprites && h.sprites.idle) || '';
  if (src) {
    el.src = src;
    // Re-apply the correct flip per state
    el.style.transform = `scaleX(${getSpriteFlip(who, heroId, state)})`;
  }
}

// ── LOAD SKILL ICONS ─────────────────────────────────────────
function loadSkillIcons(heroId) {
  const h = getEntity(heroId);
  ['basic','special','ultimate'].forEach(type => {
    const sk   = h.skills[type];
    const btn  = $(`btn-${type}`);
    const fb   = $(`fb-${type}`);
    const ntag = $(`name-${type}`);
    if (ntag) ntag.textContent = sk.name;
    const c = $(`cost-${type}`);
    if (c) c.textContent = sk.manaCost + 'MP';
    btn.title = `${sk.name} — ${sk.desc}`;
    btn.querySelectorAll('img.sk-icon').forEach(i => i.remove());
    if (sk.icon) {
      const img = document.createElement('img');
      img.className = 'sk-icon';
      img.alt = sk.name;
      img.src = sk.icon;
      img.onload  = () => { if (fb) fb.style.display = 'none'; };
      img.onerror = () => { img.remove(); if (fb) fb.style.display = 'flex'; };
      btn.insertBefore(img, btn.firstChild);
    }
  });
}

// ── HUD ──────────────────────────────────────────────────────
function renderHUD() {
  $('hud-p-name').innerHTML = `${B.pHero.name} <span class="hud-lv">Lv ${B.pLevel}</span>`;
  $('hud-e-name').innerHTML = `${B.eHero.name} <span class="hud-lv">Lv ${B.eLevel}</span>`;
  updateBar('p-hp-bar','p-hp-val', B.pHp, B.pMaxHp, true);
  updateBar('p-mp-bar','p-mp-val', B.pMp, B.pMaxMp, false);
  updateBar('e-hp-bar','e-hp-val', B.eHp, B.eMaxHp, true);
  updateBar('e-mp-bar','e-mp-val', B.eMp, B.eMaxMp, false);
  $('hud-player').className = 'hud-box' + (B.turn==='player' ? ' your-turn' : '');
  $('hud-enemy').className  = 'hud-box enemy-box' + (B.turn==='enemy' ? ' enemy-turn' : '');
  $('turn-text').textContent = B.turn==='player' ? 'YOUR TURN' : 'ENEMY TURN';
  renderStatus('p-status', B.pBurning, B.pFrozen, B.pParalyzed, B.pGuard);
  renderStatus('e-status', B.eBurning, B.eFrozen, B.eParalyzed, B.eGuard);
  $('p-frozen').className = 'frozen-overlay' + (B.pFrozen > 0 ? ' active' : '');
  $('e-frozen').className = 'frozen-overlay' + (B.eFrozen > 0 ? ' active' : '');
  updateSkillBtns();
}

function updateBar(barId, valId, cur, max, isHp) {
  const pct = Math.max(0, Math.min(100, cur/max*100));
  const el  = $(barId); if (!el) return;
  el.style.width = pct + '%';
  const vl = $(valId); if (vl) vl.textContent = `${Math.max(0,Math.floor(cur))} / ${max}`;
  if (isHp) {
    if (pct < 25)      el.style.background = 'linear-gradient(90deg,#660000,#cc0000,#ff2222)';
    else if (pct < 50) el.style.background = 'linear-gradient(90deg,#884400,#ee6600,#ffaa44)';
    else               el.style.background = 'linear-gradient(90deg,#aa0000,#ff4444,#ff9999)';
  }
}

function renderStatus(elId, burn, freeze, paralyzed, guard) {
  const el = $(elId); if (!el) return;
  el.innerHTML =
    (burn      > 0 ? `<span class="status-badge sb-burn">🔥 Burn ${burn}</span>`          : '') +
    (freeze    > 0 ? `<span class="status-badge sb-freeze">❄ Frozen ${freeze}</span>`      : '') +
    (paralyzed > 0 ? `<span class="status-badge sb-paralyzed">⚡ Paralyzed ${paralyzed}</span>` : '') +
    (guard         ? `<span class="status-badge sb-guard">🛡 Guard</span>`                  : '');
}

function updateSkillBtns() {
  const isStory  = B.mode === 'story';
  const skillUL  = JSON.parse(safeLocalStorage.getItem('tenfold_skills_' + (Game.user && Game.user.userID || 'demo')) || '{}');

  // A skill is playable when:
  //   • The player is an admin (all skills always available), OR
  //   • The skill has been unlocked via story progress (tenfold_skills_ localStorage).
  // This applies equally in both story battles and arena — you only use what you've earned.
  function isSkillPlayable(type) {
    if (Game.isAdmin()) return true; // admins always have all skills
    const heroId   = B.playerHeroId;
    const unlocked = (skillUL && skillUL[heroId]) ? skillUL[heroId] : [];
    return unlocked.includes(type);
  }

  // Hint text shown on the lock overlay — dynamic per chapter's hero
  const CH_HERO_NUM = {aeron:1,lyra:2,kael:3,riven:4,selene:5,draven:6,mira:7,orion:8,brutus:9,elysia:10};
  const _ch = CH_HERO_NUM[B.playerHeroId] || 1;
  const SKILL_HINTS = {
    basic:    `Clear Ch.${_ch} Stage 1`,
    special:  `Clear Ch.${_ch} Stage 3`,
    ultimate: `Clear Ch.${_ch} Stage 4`,
  };

  ['basic','special','ultimate'].forEach(t => {
    const btn = $(`btn-${t}`); if (!btn) return;
    const sk  = B.pHero.skills[t];
    const cd  = B.pCD[t];
    const noMp = sk.manaCost > 0 && B.pMp < sk.manaCost;
    const storyLocked = !isSkillPlayable(t);

    // Toggle story-locked class and overlay
    btn.classList.toggle('story-locked', storyLocked);
    let lockEl = btn.querySelector('.skill-lock-overlay');
    if (storyLocked) {
      if (!lockEl) {
        lockEl = document.createElement('div');
        lockEl.className = 'skill-lock-overlay';
        btn.appendChild(lockEl);
      }
      lockEl.innerHTML = `<span>🔒</span><small>${SKILL_HINTS[t]}</small>`;
    } else if (lockEl) {
      lockEl.remove();
    }

    // Disable if story-locked OR normal reasons
    btn.disabled = storyLocked || B.turn !== 'player' || B.locked || B.over || cd > 0 || noMp;

    let cdEl = btn.querySelector('.skill-cd-overlay');
    if (cd > 0 && !storyLocked) {
      if (!cdEl) { cdEl = document.createElement('div'); cdEl.className = 'skill-cd-overlay'; btn.appendChild(cdEl); }
      cdEl.textContent = cd;
    } else if (cdEl) cdEl.remove();
  });
  const atk = $('btn-attack');
  if (atk) atk.disabled = B.turn !== 'player' || B.locked || B.over;
}

// ── LOG ──────────────────────────────────────────────────────
function logMsg(msg, cls='ls') {
  const log = $('battle-log');
  const p   = document.createElement('p');
  p.className = cls; p.textContent = msg;
  log.appendChild(p);
  log.scrollTop = log.scrollHeight;
}

// ── DAMAGE CALC ──────────────────────────────────────────────
function calcDmg(atk, def, base, crit) {
  const isCrit = Math.random()*100 < crit;
  const v = 0.88 + Math.random()*0.24;
  let dmg = Math.floor(base * (atk/120) * v * (100/(100+def*0.6)));
  if (isCrit) dmg = Math.floor(dmg*1.75);
  return { dmg:Math.max(1,dmg), isCrit };
}

// ── APPROACH / RETREAT ANIMATION ─────────────────────────────
// Cycles walk → run → sprint forward, then sprint → run → walk backward
// Uses CSS translateX on the fighter-sprite-wrap

const APPROACH_STEPS = [
  { state:'walk',   x:25,  dur:120 },
  { state:'walk',   x:55,  dur:110 },
  { state:'run',    x:95,  dur:100 },
  { state:'run',    x:145, dur:95  },
  { state:'sprint', x:210, dur:85  },
  { state:'sprint', x:265, dur:80  },
  { state:'sprint', x:300, dur:0   },  // last step — right up close to enemy
];
const RETREAT_STEPS = [
  { state:'sprint', x:255, dur:80  },
  { state:'run',    x:185, dur:90  },
  { state:'run',    x:120, dur:100 },
  { state:'walk',   x:60,  dur:110 },
  { state:'walk',   x:15,  dur:120 },
  { state:'idle',   x:0,   dur:0   },
];

function doApproach(who, onDone) {
  const wrapEl = $(who === 'player' ? 'p-wrap' : 'e-wrap');
  // Enemy moves toward player (negative X since it's on the right)
  const dir = who === 'player' ? 1 : -1;
  let idx = 0;
  function next() {
    if (idx >= APPROACH_STEPS.length) { onDone(); return; }
    const step = APPROACH_STEPS[idx++];
    setSprite(who, step.state);
    wrapEl.style.transform = `translateX(${step.x * dir}px)`;
    if (step.dur > 0) setTimeout(next, step.dur);
    else onDone();
  }
  next();
}

function doRetreat(who, onDone) {
  const wrapEl = $(who === 'player' ? 'p-wrap' : 'e-wrap');
  const dir = who === 'player' ? 1 : -1;
  let idx = 0;
  function next() {
    if (idx >= RETREAT_STEPS.length) {
      wrapEl.style.transform = '';
      if (onDone) onDone();
      return;
    }
    const step = RETREAT_STEPS[idx++];
    setSprite(who, step.state);
    wrapEl.style.transform = `translateX(${step.x * dir}px)`;
    if (step.dur > 0) setTimeout(next, step.dur);
    else {
      wrapEl.style.transform = '';
      if (onDone) onDone();
    }
  }
  next();
}

// ── SKILL EFFECT ─────────────────────────────────────────────
// plainattack → approach → attack.png → shake → retreat  (no projectile)
// basic/special/ultimate → approach → cast frames → travel → impact → retreat
function spawnEffect(fromWho, skillType, onDone) {
  const heroId = fromWho === 'player' ? B.playerHeroId : B.enemyHeroId;
  const h      = getEntity(heroId);
  const stage  = $('arena-stage');

  // ── PLAIN ATTACK (ATTACK button) ────────────────────────────────────────────
  // Ranged / mage heroes (selene, mira, elysia) stay in place and fire a
  // glowing projectile toward the enemy.
  // Melee heroes teleport to the enemy, strike, and teleport back (original).
  if (skillType === 'plainattack') {
    const RANGED_HEROES = ['selene', 'mira', 'elysia'];

    if (RANGED_HEROES.includes(heroId)) {
      // ── RANGED PLAIN ATTACK ──────────────────────────────────────────────
      const wrapEl   = $(fromWho === 'player' ? 'p-wrap' : 'e-wrap');
      const targetEl = $(fromWho === 'player' ? 'e-wrap' : 'p-wrap');

      // 1. Play attack sprite
      setSprite(fromWho, 'attack');

      // Small wind-up delay before the projectile fires
      setTimeout(() => {
        // 2. Spawn a glowing orb / projectile from the attacker's center
        const stR   = stage.getBoundingClientRect();
        const fR    = wrapEl.getBoundingClientRect();
        const tR    = targetEl.getBoundingClientRect();
        const HALF  = 18; // half of orb size (36px orb)

        // Start at attacker center, end at target center
        const sx = fR.left - stR.left + fR.width  / 2 - HALF;
        const sy = fR.top  - stR.top  + fR.height / 2 - HALF;
        const ex = tR.left - stR.left + tR.width  / 2 - HALF;
        const ey = tR.top  - stR.top  + tR.height / 2 - HALF;

        // 3. Travel animation (easing cubic)
        const DX  = ex - sx, DY = ey - sy;
        // Angle the projectile faces (radians), used for arrow rotation
        const travelAngle = Math.atan2(DY, DX); // radians, 0 = rightward
        const DUR = Math.max(340, Math.min(560, Math.hypot(DX, DY) * 0.50));
        let t0 = null;
        const ease = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;

        // ── BUILD PROJECTILE ──────────────────────────────────────────────
        const proj = document.createElement('div');
        proj.style.cssText = `
          position: absolute;
          z-index: 62;
          pointer-events: none;
          left: ${sx}px;
          top:  ${sy}px;
        `;

        if (heroId === 'selene') {
          // Arrow: shaft (rectangle) + arrowhead (triangle via clip-path)
          // Composed of two child divs inside a rotated wrapper.
          // Arrow points RIGHT by default; we rotate to face the target.
          const ARROW_W = 52, ARROW_H = 10;
          proj.style.width  = ARROW_W + 'px';
          proj.style.height = ARROW_H + 'px';
          // Rotate to face travel direction; transform-origin at left-center (nock end)
          proj.style.transformOrigin = '0 50%';
          proj.style.transform = `rotate(${travelAngle}rad)`;

          // Shaft
          const shaft = document.createElement('div');
          shaft.style.cssText = `
            position: absolute;
            left: 0; top: 50%;
            transform: translateY(-50%);
            width: 68%; height: 3px;
            background: linear-gradient(90deg, #b8860b, #f0c040, #e8e0d0);
            border-radius: 2px;
            box-shadow: 0 0 6px rgba(240,192,64,0.7);
          `;

          // Arrowhead (triangle pointing right)
          const head = document.createElement('div');
          head.style.cssText = `
            position: absolute;
            right: 0; top: 50%;
            transform: translateY(-50%);
            width: 0; height: 0;
            border-top:    5px solid transparent;
            border-bottom: 5px solid transparent;
            border-left:   14px solid #c8a8ff;
            filter: drop-shadow(0 0 5px rgba(200,168,255,1));
          `;

          // Moon glow at arrowhead
          const glow = document.createElement('div');
          glow.style.cssText = `
            position: absolute;
            right: -2px; top: 50%;
            transform: translateY(-50%);
            width: 14px; height: 14px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.95) 0%, rgba(200,168,255,0.7) 45%, transparent 75%);
            box-shadow: 0 0 10px 4px rgba(200,168,255,0.85);
          `;

          proj.appendChild(shaft);
          proj.appendChild(head);
          proj.appendChild(glow);

        } else {
          // Orb projectile for Mira and Elysia
          const orbStyles = {
            mira:   { bg: 'radial-gradient(circle, #ffffff 0%, #88ddff 30%, #0077cc 65%, transparent 100%)', shadow: '0 0 18px 6px rgba(0,191,255,0.9)',   size: 36 },
            elysia: { bg: 'radial-gradient(circle, #ffffff 0%, #ffaaff 30%, #cc44cc 65%, transparent 100%)', shadow: '0 0 18px 6px rgba(255,136,255,0.9)', size: 36 },
          };
          const orb = orbStyles[heroId] || orbStyles.elysia;
          proj.style.width        = orb.size + 'px';
          proj.style.height       = orb.size + 'px';
          proj.style.borderRadius = '50%';
          proj.style.background   = orb.bg;
          proj.style.boxShadow    = orb.shadow;
        }

        stage.appendChild(proj);

        function step(ts) {
          if (!t0) t0 = ts;
          const t  = Math.min((ts - t0) / DUR, 1);
          const e  = ease(t);
          // Slight arc only for orb heroes; arrow travels flat (archers aim true)
          const arc = heroId === 'selene' ? -Math.sin(t * Math.PI) * 14 : -Math.sin(t * Math.PI) * 28;
          proj.style.left    = (sx + DX * e) + 'px';
          proj.style.top     = (sy + DY * e + arc) + 'px';
          proj.style.opacity = t > 0.80 ? String(1 - (t - 0.80) / 0.20) : '1';
          if (heroId !== 'selene') {
            const sc = 0.85 + e * 0.45;
            proj.style.transform = `scale(${sc})`;
          }
          if (t < 1) { requestAnimationFrame(step); return; }

          // 4. Impact
          proj.remove();
          spawnImpact(ex + HALF, ey + HALF, h.color || '#ffffff', stage);
          hitShake(fromWho === 'player' ? 'enemy' : 'player');

          // 5. Return sprite to idle
          setSprite(fromWho, 'idle');
          onDone();
        }
        requestAnimationFrame(step);
      }, 160); // wind-up delay
      return;
    }

    // ── MELEE PLAIN ATTACK (original — teleport) ────────────────────────────
    const wrapEl  = $(fromWho === 'player' ? 'p-wrap' : 'e-wrap');
    const targetEl = $(fromWho === 'player' ? 'e-wrap' : 'p-wrap');
    const dir = fromWho === 'player' ? 1 : -1;

    // Calculate how far to move to be right beside the enemy
    const wrapRect   = wrapEl.getBoundingClientRect();
    const targetRect = targetEl.getBoundingClientRect();
    const gap = 10; // px gap between sprites
    let moveX;
    if (fromWho === 'player') {
      moveX = (targetRect.left - wrapRect.right) + gap;
    } else {
      moveX = (targetRect.right - wrapRect.left) - gap;
    }

    // Instant teleport to enemy's side
    wrapEl.style.transition = 'none';
    setSprite(fromWho, 'attack');
    wrapEl.style.transform = `translateX(${moveX}px)`;
    // Hit the enemy right away
    hitShake(fromWho === 'player' ? 'enemy' : 'player');
    setTimeout(() => {
      // Instant teleport back
      wrapEl.style.transition = 'none';
      wrapEl.style.transform = '';
      setSprite(fromWho, 'idle');
      onDone();
    }, 320);
    return;
  }

  const sk = h.skills[skillType];

  // ── SKILL WITH NO FRAMES → quick shake only ──
  if (!sk.frames || sk.frames.length === 0) {
    doApproach(fromWho, () => {
      hitShake(fromWho === 'player' ? 'enemy' : 'player');
      setTimeout(() => doRetreat(fromWho, onDone), 200);
    });
    return;
  }

  // ── HEAL SKILL (damage < 0) → play frames on self, no approach/travel ──
  if (sk.damage < 0) {
    const stR  = stage.getBoundingClientRect();
    const fR   = $(fromWho === 'player' ? 'p-wrap' : 'e-wrap').getBoundingClientRect();
    const HALF = 110;
    const cx   = fR.left - stR.left + fR.width/2  - HALF;
    const cy   = fR.top  - stR.top  + fR.height/2 - HALF;

    const fx = document.createElement('div');
    fx.className = 'skill-fx';
    fx.style.cssText = `left:${cx}px;top:${cy}px;opacity:0;`;
    stage.appendChild(fx);

    const FRAME_MS = 110;
    let fi = 0;
    function nextHealFrame() {
      fx.innerHTML = `<img src="${sk.frames[fi]}" alt=""
        style="filter:drop-shadow(0 0 22px ${h.color}) brightness(1.4);">`;
      fx.style.opacity = '1';
      fi++;
      if (fi < sk.frames.length) {
        setTimeout(nextHealFrame, FRAME_MS);
      } else {
        setTimeout(() => { fx.remove(); onDone(); }, 200);
      }
    }
    nextHealFrame();
    return;
  }

  // Approach first, then cast
  doApproach(fromWho, () => {
    const stR  = stage.getBoundingClientRect();
    const pR   = $('p-wrap').getBoundingClientRect();
    const eR   = $('e-wrap').getBoundingClientRect();
    const fR   = fromWho === 'player' ? pR : eR;
    const tR   = fromWho === 'player' ? eR : pR;
    const HALF = 110;
    const sx   = fR.left - stR.left + fR.width/2  - HALF;
    const sy   = fR.top  - stR.top  + fR.height/2 - HALF;
    const ex   = tR.left - stR.left + tR.width/2  - HALF;
    const ey   = tR.top  - stR.top  + tR.height/2 - HALF;

    const fx = document.createElement('div');
    fx.className = 'skill-fx';
    // Skill FX faces the direction it travels.
    // We derive the flip from getSpriteFlip using the 'attack' state,
    // which respects flipStates overrides (needed for story enemies like AshWolf).
    // Enemy attacks travel LEFT  → flip when the sprite naturally faces right in 'attack' state.
    // Player attacks travel RIGHT → flip when the sprite naturally faces left in 'attack' state.
    let fxFlip = false;
    if (fromWho === 'enemy') {
      // getSpriteFlip returns -1 when the enemy sprite needs no flip (already faces left/player).
      // It returns +1 when the enemy sprite needs a flip (naturally faces right).
      // For the FX we want to flip if the sprite naturally faces right.
      const sprFlip = getSpriteFlip('enemy', B.enemyHeroId, 'attack');
      fxFlip = sprFlip === 1; // sprite faces right → FX must flip to face left (toward player)
    } else {
      const sprFlip = getSpriteFlip('player', B.playerHeroId, 'attack');
      fxFlip = sprFlip === -1; // sprite faces left → FX must flip to face right (toward enemy)
    }
    fx.style.cssText = `left:${sx}px;top:${sy}px;opacity:0;` +
      (fxFlip ? 'transform:scaleX(-1);' : '');
    stage.appendChild(fx);

    // Frame rate: 110ms — natural timing
    const FRAME_MS = 110;
    let fi = 0;
    const totalFrames = sk.frames.length;
    function nextFrame() {
      // Move the effect progressively toward the target as frames play.
      // Frames cover the first 70% of the distance; travel() handles the rest.
      const progress = (fi / totalFrames) * 0.7;
      const cx = sx + (ex - sx) * progress;
      const cy = sy + (ey - sy) * progress;
      fx.style.left = cx + 'px';
      fx.style.top  = cy + 'px';
      fx.innerHTML = `<img src="${sk.frames[fi]}" alt=""
        style="filter:drop-shadow(0 0 22px ${h.color}) brightness(1.25);">`;
      fx.style.opacity = '1';
      fi++;
      if (fi < totalFrames) {
        setTimeout(nextFrame, FRAME_MS);
      } else {
        // Travel the remaining 30% to the target
        travel(fx, cx, cy, ex, ey, h.color, fromWho, sk, fxFlip, () => {
          // After impact: retreat
          doRetreat(fromWho, onDone);
        }, stage);
      }
    }
    nextFrame();
  });
}

function travel(fx, sx, sy, ex, ey, color, fromWho, sk, fxFlip, onDone, stage) {
  const dx = ex-sx, dy = ey-sy;
  // Travel speed: moderate — not too fast, not too slow
  const dur = Math.max(480, Math.min(700, Math.hypot(dx,dy) * 0.6));
  fx.innerHTML = `<img src="${sk.frames[sk.frames.length-1]}" alt=""
    style="width:100%;height:100%;object-fit:contain;
    filter:drop-shadow(0 0 26px ${color}) brightness(1.3);">`;
  let t0 = null;
  const HALF = 110;
  const ease = t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
  function step(ts) {
    if (!t0) t0 = ts;
    const t = Math.min((ts-t0)/dur, 1), e = ease(t), sc = 1 + e * 0.3;
    fx.style.left      = (sx+dx*e)+'px';
    fx.style.top       = (sy+dy*e)+'px';
    fx.style.transform = fxFlip ? `scaleX(-1) scale(${sc})` : `scale(${sc})`;
    fx.style.opacity   = t > 0.78 ? String(1-(t-0.78)/0.22) : '1';
    if (t < 1) { requestAnimationFrame(step); return; }
    fx.remove();
    spawnImpact(ex+HALF, ey+HALF, color, stage);
    hitShake(fromWho === 'player' ? 'enemy' : 'player');
    onDone();
  }
  requestAnimationFrame(step);
}

function spawnImpact(x, y, color, stage) {
  const b = document.createElement('div');
  b.className = 'impact-burst';
  b.style.cssText = `left:${x}px;top:${y}px;background:radial-gradient(circle,${color} 0%,${color}55 45%,transparent 70%);`;
  stage.appendChild(b);
  b.addEventListener('animationend', () => b.remove(), {once:true});
}

function hitShake(who) {
  const el = $(who === 'player' ? 'p-wrap' : 'e-wrap'); if (!el) return;
  el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
  el.addEventListener('animationend', () => el.classList.remove('shake'), {once:true});
}

function spawnDmg(who, value, isCrit=false, isHeal=false) {
  const wrap = $(who === 'player' ? 'p-wrap' : 'e-wrap');
  const n    = document.createElement('div');
  n.className = 'dmg-num' + (isCrit?' crit':'') + (isHeal?' heal':'');
  if (isHeal)        n.textContent = '+'+Math.abs(value);
  else if (value===0){ n.style.color='#888'; n.textContent='MISS'; }
  else {
    n.textContent = (isCrit ? '⚡ ' : '')+value;
    n.style.color = isCrit ? '#ffdd00'
      : (getEntity(who==='player'?B.enemyHeroId:B.playerHeroId)||{color:'#ff8888'}).color;
  }
  wrap.appendChild(n);
  n.addEventListener('animationend', ()=>n.remove(), {once:true});
}

// ── SPAWN MP DRAIN FLOAT ──────────────────────────────────────
function spawnMpDrain(who, amount) {
  if (!amount || amount <= 0) return;
  const wrap = $(who === 'player' ? 'p-wrap' : 'e-wrap');
  const n    = document.createElement('div');
  n.className = 'dmg-num mana-drain';
  n.textContent = '💧-' + amount + ' MP';
  n.style.top = '38%'; // offset so it doesn't overlap damage number
  wrap.appendChild(n);
  n.addEventListener('animationend', ()=>n.remove(), {once:true});
}
function applyDmg(target, amount) {
  const guarded = target==='enemy' ? B.eGuard : B.pGuard;
  const r = guarded ? Math.floor(amount*.4) : amount;
  if (target==='enemy') B.eHp = Math.max(0, B.eHp-r);
  else                  B.pHp = Math.max(0, B.pHp-r);
  return r;
}
function applyHeal(target, amount) {
  if (target==='player') B.pHp = Math.min(B.pMaxHp, B.pHp+amount);
  else                   B.eHp = Math.min(B.eMaxHp, B.eHp+amount);
}

// ── USE PLAIN ATTACK (ATTACK button / Q key) — no skill frames ────────────
function useAttack() {
  if (B.turn!=='player'||B.locked||B.over) return;

  if (B.pFrozen > 0) {
    B.pFrozen--;
    renderHUD();
    if (B.pFrozen > 0) { logMsg('❄ Still frozen — cannot act!','ls'); return; }
    logMsg('❄ Thawed! You can act now.','ls');
  }

  // Paralysis: 50% chance to lose turn
  if (B.pParalyzed > 0 && Math.random() < 0.5) {
    B.pParalyzed--;
    renderHUD();
    logMsg(`⚡ Paralyzed! You can't move! (${B.pParalyzed} left)`,'ls');
    tickStatus('player');
    tickCD('player'); regenMp('player');
    B.turn='enemy'; B.locked=false; renderHUD();
    setTimeout(enemyAI, 900+Math.random()*400);
    return;
  }

  B.locked = true;
  B.pMp = Math.min(B.pMaxMp, B.pMp + 5); // plain attack still regens 5 MP
  updateSkillBtns();
  spawnEffect('player', 'plainattack', () => {
    const sk = B.pHero.skills.basic; // use basic damage stats but no effect
    const boost = B.pBoost > 0 ? 1.3 : 1;
    const {dmg, isCrit} = calcDmg(B.pAtk * boost, B.eDef, sk.damage, B.pCrit);
    const r = applyDmg('enemy', dmg); spawnDmg('enemy', r, isCrit);
    // Arena mode: plain attack does NOT drain mana
    logMsg(`⚔ ${B.pHero.name} attacks! Deals ${r}${isCrit?' (CRIT!)':''} dmg.`, 'lp');
    if (B.playerHeroId==='aeron') { B.eBurning=Math.max(B.eBurning,2); logMsg('🔥 Enemy burns!','lp'); }
    if (B.playerHeroId==='kael')  { B.eParalyzed=Math.max(B.eParalyzed,1); logMsg('⚡ Enemy paralyzed!','lp'); }
    renderHUD(); // show MP drain immediately
    checkEnd(()=>{ tickStatus('enemy'); renderHUD();
      checkEnd(()=>{ tickCD('player'); regenMp('player');
        B.turn='enemy'; B.locked=false; renderHUD();
        setTimeout(enemyAI, 900+Math.random()*400);
      });
    });
  });
}

// ── USE SKILL (PLAYER) ───────────────────────────────────────
function useSkill(type) {
  if (B.turn!=='player'||B.locked||B.over) return;

  // Block locked skills in both arena AND story mode
  // (admins bypass this — Game.isAdmin() check is inside the same storage read)
  {
    const skillUL  = JSON.parse(safeLocalStorage.getItem('tenfold_skills_' + (Game.user && Game.user.userID || 'demo')) || '{}');
    const unlocked = Game.isAdmin() ? ['basic','special','ultimate'] : ((skillUL[B.playerHeroId]) || []);
    if (!unlocked.includes(type)) {
      const CH_HERO = {aeron:1,lyra:2,kael:3,riven:4,selene:5,draven:6,mira:7,orion:8,brutus:9,elysia:10};
      const chNum = CH_HERO[B.playerHeroId] || 1;
      const hints = { basic:`Clear Chapter ${chNum} Stage 1`, special:`Clear Chapter ${chNum} Stage 3`, ultimate:`Clear Chapter ${chNum} Stage 4` };
      logMsg(`🔒 ${B.pHero.skills[type].name} is locked! ${hints[type]} in Story Mode to unlock.`, 'ls');
      return;
    }
  }

  // Tick down freeze at start of player turn (not block — just decrement)
  if (B.pFrozen > 0) {
    B.pFrozen--;
    renderHUD();
    if (B.pFrozen > 0) { logMsg('❄ Still frozen — cannot act!','ls'); return; }
    logMsg('❄ Thawed! You can act now.','ls');
    // Don't return — let them act
  }

  // Paralysis: 50% chance to lose turn
  if (B.pParalyzed > 0 && Math.random() < 0.5) {
    B.pParalyzed--;
    renderHUD();
    logMsg(`⚡ Paralyzed! You can't move! (${B.pParalyzed} left)`,'ls');
    tickStatus('player');
    tickCD('player'); regenMp('player');
    B.turn='enemy'; B.locked=false; renderHUD();
    setTimeout(enemyAI, 900+Math.random()*400);
    return;
  }

  const sk = B.pHero.skills[type];
  if (B.pCD[type]>0) { logMsg(`⏳ ${sk.name} on cooldown (${B.pCD[type]})`, 'ls'); return; }
  if (sk.manaCost>0 && B.pMp<sk.manaCost) { logMsg(`💧 Not enough MP for ${sk.name}!`, 'ls'); return; }
  B.locked = true;
  B.pMp = Math.max(0, B.pMp - sk.manaCost);
  // Basic attack rewards MP (+5)
  if (type === 'basic') B.pMp = Math.min(B.pMaxMp, B.pMp + 5);
  if (sk.cooldown>0) B.pCD[type] = sk.cooldown;
  updateSkillBtns();
  // doApproach handles walk→run→sprint→attack sprite switching
  spawnEffect('player', type, () => execPlayer(type, sk));
}

function execPlayer(type, sk) {
  const ph = B.pHero; let extra='';
  const boost = B.pBoost>0 ? 1.3 : 1;

  if (type==='basic') {
    const {dmg,isCrit} = calcDmg(B.pAtk*boost, B.eDef, sk.damage, B.pCrit);
    const r = applyDmg('enemy',dmg); spawnDmg('enemy',r,isCrit);
    // Basic skill drains 10 MP from enemy in arena mode
    if (B.mode === 'arena') {
      const drain = Math.min(10, B.eMp);
      B.eMp = Math.max(0, B.eMp - drain);
      if (drain > 0) spawnMpDrain('enemy', drain);
    }
    renderHUD(); // show MP drain on bar immediately
    logMsg(`⚔ ${ph.name} uses ${sk.name}! Deals ${r}${isCrit?' (CRIT!)':''} dmg.`, 'lp');
    if (B.playerHeroId==='aeron') { B.eBurning=Math.max(B.eBurning,2); extra=' 🔥 Enemy burns!'; }
    if (B.playerHeroId==='kael')  { B.eParalyzed=Math.max(B.eParalyzed,1); extra=' ⚡ Enemy paralyzed!'; }
  } else if (type==='special') {
    if (sk.damage<0) {
      const h=Math.abs(sk.damage); applyHeal('player',h); spawnDmg('player',h,false,true);
      logMsg(`💧 ${ph.name} uses ${sk.name}! +${h} HP.`,'lh');
    } else if (sk.damage===0) {
      B.pGuard = true; extra=' 🛡 Guard raised!';
      logMsg(`🛡 ${ph.name} uses ${sk.name}!`, 'lp');
    } else {
      const {dmg,isCrit} = calcDmg(B.pAtk*boost, B.eDef, sk.damage, B.pCrit+5);
      const r = applyDmg('enemy',dmg); spawnDmg('enemy',r,isCrit);
      logMsg(`✨ ${ph.name} uses ${sk.name}! Deals ${r}${isCrit?' (CRIT!)':''} dmg.`, 'lp');
      if (B.playerHeroId==='lyra')   { B.eFrozen=1;  extra=' ❄ Enemy FROZEN!'; }
      if (B.playerHeroId==='aeron')  { B.eBurning=Math.max(B.eBurning,2); extra=' 🔥'; }
      if (B.playerHeroId==='kael')   { B.eParalyzed=Math.max(B.eParalyzed,2); extra=' ⚡ Enemy paralyzed!'; }
      if (B.playerHeroId==='selene') { B.pBoost=2; extra=' 🌙 Power surge!'; }
      if (B.playerHeroId==='draven') { B.pBoost=2; extra=' 🌑 Stepping from the shadows!'; }
    }
  } else {
    const {dmg,isCrit} = calcDmg(B.pAtk*1.5*boost, B.eDef, sk.damage, B.pCrit+10);
    const r = applyDmg('enemy',dmg); spawnDmg('enemy',r,isCrit);
    logMsg(`💥 ${ph.name} UNLEASHES ${sk.name}!! ${r}${isCrit?' (CRIT!!)':''} MASSIVE DMG!`, 'lp');
    if (B.playerHeroId==='aeron')  { B.eBurning=Math.max(B.eBurning,3); extra=' 🔥🔥 Phoenix flames!'; }
    if (B.playerHeroId==='lyra')   { B.eFrozen=2; extra=' ❄ ABSOLUTE ZERO!'; }
    if (B.playerHeroId==='mira')   { const h=80; applyHeal('player',h); extra=` +${h} HP healed!`; }
    if (B.playerHeroId==='kael')   { B.eParalyzed=Math.max(B.eParalyzed,3); extra=' ⚡⚡ STORM JUDGMENT!'; }
    if (B.playerHeroId==='riven')  { B.eFrozen=Math.max(B.eFrozen,1); extra=' 💥 Enemy STUNNED!'; }
    if (B.playerHeroId==='selene') { B.pBoost=3; extra=' 🌙✨ MOONFALL!'; }
    if (B.playerHeroId==='draven') { B.pBoost=3; extra=' 💀 NIGHTMARE EXECUTION!'; }
  }
  if (extra) logMsg(extra,'lp');
  // doRetreat (called inside spawnEffect) handles sprint→run→walk→idle
  checkEnd(()=>{ tickStatus('enemy'); renderHUD();
    checkEnd(()=>{ tickCD('player'); regenMp('player');
      B.turn='enemy'; B.locked=false; renderHUD();
      setTimeout(enemyAI, 900+Math.random()*400);
    });
  });
}

// ── ENEMY AI ─────────────────────────────────────────────────
function enemyAI() {
  if (B.over) return;

  // Handle frozen — skip turn but tick down
  if (B.eFrozen > 0) {
    B.eFrozen--;
    logMsg(`❄ ${B.eHero.name} is frozen! (${B.eFrozen} turns left)`,'le');
    tickCD('enemy'); regenMp('enemy');
    B.turn='player'; B.locked=false; renderHUD();
    if (autoPlay) setTimeout(doAutoPlayerTurn, 400);
    return;
  }

  // Handle paralyzed — 50% chance to skip turn
  if (B.eParalyzed > 0 && Math.random() < 0.5) {
    B.eParalyzed--;
    logMsg(`⚡ ${B.eHero.name} is paralyzed and can't move! (${B.eParalyzed} left)`,'le');
    tickCD('enemy'); regenMp('enemy');
    B.turn='player'; B.locked=false; renderHUD();
    if (autoPlay) setTimeout(doAutoPlayerTurn, 400);
    return;
  }

  const type = pickEnemySkill();
  const sk   = B.eHero.skills[type];
  logMsg(`${B.eHero.name} uses ${sk.name}…`,'le');
  B.locked = true;
  B.eMp = Math.max(0, B.eMp - sk.manaCost);
  // Basic attack also regens MP for enemy (+5)
  if (type === 'basic') B.eMp = Math.min(B.eMaxMp, B.eMp + 5);
  if (sk.cooldown > 0) B.eCD[type] = sk.cooldown;
  renderHUD(); // show enemy MP change immediately
  updateSkillBtns();
  spawnEffect('enemy', type, () => execEnemy(type, sk));
}

function pickEnemySkill() {
  const hp  = B.eHp / B.eMaxHp;
  const mp  = B.eMp;
  const rng = Math.random();

  // In story mode, enemy skill availability mirrors the player's unlock progression:
  //   stage 1 → basic only
  //   stage 3+ → special unlocked
  //   stage 4+ → ultimate unlocked
  // In arena mode (hero vs hero) all enemy skills are always available.
  const stageNum = B.stage || 0;
  const canSpecial  = B.mode !== 'story' || stageNum >= 3;
  const canUltimate = B.mode !== 'story' || stageNum >= 4;

  // ── ULTIMATE — use whenever available + affordable ──
  if (canUltimate && B.eCD.ultimate === 0 && mp >= 20) {
    if (hp < 0.5 || rng < 0.35) return 'ultimate';
  }

  // ── SPECIAL — use frequently when available ──
  if (canSpecial && B.eCD.special === 0 && mp >= 10) {
    const sp = B.eHero.skills.special;
    // Heal special: always use when HP below 55%
    if (sp.damage < 0 && hp < 0.55) return 'special';
    // Guard special: use 40% of the time
    if (sp.damage === 0 && rng < 0.4) return 'special';
    // Damage special: use 60% of the time when available
    if (sp.damage > 0 && rng < 0.60) return 'special';
  }

  // ── BASIC fallback ──
  return 'basic';
}

function execEnemy(type, sk) {
  const eh=B.eHero; let extra='';
  const boost = B.eBoost>0?1.3:1;
  const eElem = eh.element || '';
  const eId   = B.enemyHeroId;

  if (type==='basic') {
    const {dmg,isCrit} = calcDmg(B.eAtk*boost, B.pDef, sk.damage, B.eCrit);
    const r=applyDmg('player',dmg); spawnDmg('player',r,isCrit);
    logMsg(`${eh.name} uses ${sk.name}! You take ${r}${isCrit?' (CRIT!)':''}.`,'le');
    // Status effects by element (works for both heroes and story enemies)
    if (eElem==='Fire')      { B.pBurning=Math.max(B.pBurning,2); extra=' 🔥 You burn!'; }
    if (eElem==='Lightning') { B.pParalyzed=Math.max(B.pParalyzed,1); extra=' ⚡ You are paralyzed!'; }
    // Hero-specific overrides (only if it's actually that hero)
    if (eId==='kael')        { B.pParalyzed=Math.max(B.pParalyzed,1); extra=' ⚡ You are paralyzed!'; }
  } else if (type==='special') {
    if (sk.damage<0) {
      const h=Math.abs(sk.damage); applyHeal('enemy',h); spawnDmg('enemy',h,false,true);
      logMsg(`${eh.name} uses ${sk.name}! Heals ${h} HP.`,'le');
    } else if (sk.damage===0) {
      B.eGuard = true; extra=' 🛡 Guard raised!';
      logMsg(`🛡 ${eh.name} uses ${sk.name}!`, 'le');
    } else {
      const {dmg,isCrit} = calcDmg(B.eAtk*boost, B.pDef, sk.damage, B.eCrit+5);
      const r=applyDmg('player',dmg); spawnDmg('player',r,isCrit);
      logMsg(`${eh.name} uses ${sk.name}! You take ${r}${isCrit?' (CRIT!)':''}.`,'le');
      // Status effects by element
      if (eElem==='Fire')      { B.pBurning=Math.max(B.pBurning,2); extra=' 🔥 Scorching flames!'; }
      if (eElem==='Ice')       { B.pFrozen=1; extra=' ❄ You are FROZEN!'; }
      if (eElem==='Lightning') { B.pParalyzed=Math.max(B.pParalyzed,2); extra=' ⚡ You are paralyzed!'; }
      // Hero-specific overrides
      if (eId==='lyra')   { B.pFrozen=1; extra=' ❄ You are FROZEN!'; }
      if (eId==='kael')   { B.pParalyzed=Math.max(B.pParalyzed,2); extra=' ⚡ You are paralyzed!'; }
      if (eId==='selene') { B.eBoost=2; extra=' 🌙 Power surge!'; }
      if (eId==='draven') { B.eBoost=2; extra=' 🌑 Stepping from the shadows!'; }
    }
  } else {
    const {dmg,isCrit} = calcDmg(B.eAtk*1.5*boost, B.pDef, sk.damage, B.eCrit+10);
    const r=applyDmg('player',dmg); spawnDmg('player',r,isCrit);
    logMsg(`💥 ${eh.name} UNLEASHES ${sk.name}!! You take ${r}${isCrit?' (CRIT!!)':''} MASSIVE DMG!`,'le');
    // Status effects by element
    if (eElem==='Fire')      { B.pBurning=Math.max(B.pBurning,3); extra=' 🔥🔥 Burning inferno!'; }
    if (eElem==='Ice')       { B.pFrozen=2; extra=' ❄ Frozen solid!'; }
    if (eElem==='Lightning') { B.pParalyzed=Math.max(B.pParalyzed,3); extra=' ⚡⚡ STORM JUDGMENT!'; }
    // Hero-specific overrides
    if (eId==='aeron')  { B.pBurning=Math.max(B.pBurning,3); extra=' 🔥🔥'; }
    if (eId==='lyra')   { B.pFrozen=2; extra=' ❄ Frozen solid!'; }
    if (eId==='mira')   { const h=80; applyHeal('enemy',h); extra=` Healed ${h}!`; }
    if (eId==='kael')   { B.pParalyzed=Math.max(B.pParalyzed,3); extra=' ⚡⚡ STORM JUDGMENT!'; }
    if (eId==='riven')  { B.pFrozen=Math.max(B.pFrozen,1); extra=' 💥 You are STUNNED!'; }
    if (eId==='selene') { B.eBoost=3; extra=' 🌙✨ MOONFALL!'; }
    if (eId==='draven') { B.eBoost=3; extra=' 💀 NIGHTMARE EXECUTION!'; }
  }
  if (extra) logMsg(extra,'le');
  // doRetreat handles sprint→run→walk→idle for enemy too
  checkEnd(()=>{ tickStatus('player'); renderHUD();
    checkEnd(()=>{ tickCD('enemy'); regenMp('enemy');
      B.turn='player'; B.locked=false; B.turnCount++;
      renderHUD();
      if (autoPlay) setTimeout(doAutoPlayerTurn, 400);
    });
  });
}

// ── STATUS TICKS ─────────────────────────────────────────────
function tickStatus(who) {
  if (who==='player'&&B.pBurning>0) {
    const d=Math.floor(B.pMaxHp*.05);
    B.pHp=Math.max(0,B.pHp-d); B.pBurning--;
    logMsg(`🔥 ${B.pHero.name} takes ${d} burn!`,'le'); spawnDmg('player',d);
  }
  if (who==='enemy'&&B.eBurning>0) {
    const d=Math.floor(B.eMaxHp*.05);
    B.eHp=Math.max(0,B.eHp-d); B.eBurning--;
    logMsg(`🔥 ${B.eHero.name} takes ${d} burn!`,'lp'); spawnDmg('enemy',d);
  }
  if (who==='player'&&B.pFrozen>0)    B.pFrozen--;
  if (who==='enemy'&&B.eFrozen>0)     B.eFrozen--;
  if (who==='player'&&B.pParalyzed>0) B.pParalyzed--;
  if (who==='enemy'&&B.eParalyzed>0)  B.eParalyzed--;
  if (who==='player') { B.pGuard=false; if(B.pBoost>0)B.pBoost--; }
  if (who==='enemy')  { B.eGuard=false; if(B.eBoost>0)B.eBoost--; }
}
function tickCD(who) {
  const cds = who==='player'?B.pCD:B.eCD;
  for (const k in cds) if(cds[k]>0) cds[k]--;
}
function regenMp(who) {
  if (who==='player') B.pMp = Math.min(B.pMaxMp, B.pMp + 6);
  else                B.eMp = Math.min(B.eMaxMp, B.eMp + 6);
}

// ── CHECK END ────────────────────────────────────────────────
function checkEnd(onContinue) {
  renderHUD();
  if (B.eHp<=0&&!B.over) { B.over=true; B.locked=true; const s=$('e-sprite'); if(s)s.classList.add('dead'); setTimeout(()=>showResult('win'),1300); return; }
  if (B.pHp<=0&&!B.over) { B.over=true; B.locked=true; const s=$('p-sprite'); if(s)s.classList.add('dead'); setTimeout(()=>showResult('lose'),1300); return; }
  if (onContinue) onContinue();
}

// ── SHOW RESULT ──────────────────────────────────────────────
async function showResult(outcome) {
  const won = outcome==='win';
  const pts = won?100:10;
  $('result-label').textContent = won?'VICTORY!':'DEFEATED';
  $('result-label').className   = 'result-label '+(won?'win':'lose');
  $('result-sub').textContent   = won?`You defeated ${B.eHero.name}!`:`${B.eHero.name} has bested you.`;
  $('result-pts-num').textContent = '+'+pts;
  $('result-hero-info').textContent = `${B.pHero.name} · ${B.map.name} · Turn ${B.turnCount+1}`;
  $('result-overlay').classList.add('show');

  // Do NOT optimistically write the score before the server confirms it.
  // This prevents temporary/different totals across PC, browser and APK.
  const battleID = 'BAT_' + user.userID + '_' + Date.now() + '_' + Math.floor(Math.random()*100000);
  const battleDate = new Date().toISOString();

  const bl = JSON.parse(safeLocalStorage.getItem('tenfold_battles_'+user.userID)||'[]');
  bl.unshift({battleID,heroID:B.playerHeroId,heroName:B.pHero.name,enemyHeroID:B.enemyHeroId,
    enemyHeroName:B.eHero.name,result:outcome,battleDate:battleDate,
    storyChapter: B.mode==='story' ? B.chapter : 0});
  safeLocalStorage.setItem('tenfold_battles_'+user.userID, JSON.stringify(bl.slice(0,20)));

  const lvls = JSON.parse(safeLocalStorage.getItem('tenfold_levels_'+user.userID)||'{}');
  const prevLv = lvls[B.playerHeroId]||1;

  // ── STORY MODE: chapter-aware level milestones per stage ──
  // Each chapter's boss has a fixed level. The hero ramps up to
  // match it exactly by Stage 5, so the showdown is always equal.
  //
  //  Ch  | Boss Lv | St1 | St2 | St3 | St4 | St5(boss)
  //  ----+---------+-----+-----+-----+-----+----------
  //   Ch | Boss Lv | St1 | St2 | St3 | St4 | St5
  //   1  |    5    |  1  |  2  |  3  |  4  |   5
  //   2  |   10    |  6  |  7  |  8  |  9  |  10
  //   3  |   15    | 11  | 12  | 13  | 14  |  15
  //   4  |   20    | 16  | 17  | 18  | 19  |  20
  //   5  |   25    | 21  | 22  | 23  | 24  |  25
  //   6  |   30    | 26  | 27  | 28  | 29  |  30
  //   7  |   35    | 31  | 32  | 33  | 34  |  35
  //   8  |   40    | 36  | 37  | 38  | 39  |  40
  //   9  |   45    | 41  | 42  | 43  | 44  |  45
  //  10  |   50    | 46  | 47  | 48  | 49  |  50
  //
  // The hero level NEVER goes down — if already higher, it stays.
  // Arena / loss: use the normal XP accumulation instead.
  let lv, xp;
  if (B.mode === 'story' && won) {
    const target = getChapterStageLv(B.chapter, B.stage);
    lv = Math.max(prevLv, target);   // never downgrade
    xp = lvls[B.playerHeroId+'_xp'] || 0; // keep existing XP
  } else {
    // Normal XP accumulation (arena + story losses)
    xp = (lvls[B.playerHeroId+'_xp']||0) + pts;
    lv = prevLv;
    while (xp >= lv*100) { xp -= lv*100; lv++; }
  }
  lvls[B.playerHeroId]=lv; lvls[B.playerHeroId+'_xp']=xp;
  safeLocalStorage.setItem('tenfold_levels_'+user.userID, JSON.stringify(lvls));

  // ── SYNC LEVEL/XP TO SERVER ───────────────────────────────
  // Push the authoritative level+XP to Google Sheets so every
  // device (PC, APK, phone browser) reads the same value.
  apiCall({ action:'setHeroLevel', userID:user.userID,
            heroID:B.playerHeroId, level:lv, xp:xp });

  if (lv>prevLv) {
    const n=document.createElement('div'); n.className='lvl-up-notif';
    n.textContent=`⬆ ${B.pHero.name} reached Level ${lv}!`;
    $('arena-stage').appendChild(n);
    n.addEventListener('animationend',()=>n.remove(),{once:true});
  }

  // ── STORY MODE: save progress & build result buttons ──────
  if (B.mode==='story' && won) {
    // Save stage completion to safeLocalStorage for story.html to pick up
    const starsEarned = B.pHp > B.pMaxHp*0.5 ? 3 : B.pHp > B.pMaxHp*0.25 ? 2 : 1;
    safeSessionStorage.setItem('tenfold_story_return', JSON.stringify({
      chNum: B.chapter, stageNum: B.stage, won: true, stars: starsEarned
    }));

    // Save progress immediately here too so it's not lost
    const storyProg = JSON.parse(safeLocalStorage.getItem('tenfold_story_'+user.userID)||'{}');
    const key = `ch${B.chapter}_st${B.stage}`;
    if (!storyProg[key] || starsEarned > (storyProg[key].stars||0)) {
      storyProg[key] = { completed:true, stars:starsEarned };
      safeLocalStorage.setItem('tenfold_story_'+user.userID, JSON.stringify(storyProg));
    }

    // ── SKILL UNLOCK ON STAGE CLEAR ───────────────────────
    // Each chapter unlocks skills for THAT chapter's hero only:
    //   Stage 1 → Basic Skill
    //   Stage 3 → Special Skill
    //   Stage 4 → Ultimate Skill
    // Same pattern for every chapter (Ch.1 = Aeron, Ch.2 = Lyra, etc.)
    (function unlockSkills() {
      const ch = B.chapter, st = B.stage;

      // Map chapter number → hero id
      const CH_HERO = {
        1:'aeron', 2:'lyra',  3:'kael',  4:'riven', 5:'selene',
        6:'draven',7:'mira',  8:'orion', 9:'brutus',10:'elysia'
      };
      const heroId = CH_HERO[ch];
      if (!heroId) return; // unknown chapter, skip

      const skillKey = 'tenfold_skills_' + user.userID;
      const skillUL  = JSON.parse(safeLocalStorage.getItem(skillKey) || '{}');
      if (!skillUL[heroId]) skillUL[heroId] = [];

      // Determine which skill this stage unlocks
      const toUnlock = [];
      if (st === 1) toUnlock.push('basic');
      if (st === 3) toUnlock.push('special');
      if (st === 4) toUnlock.push('ultimate');
      if (toUnlock.length === 0) return; // stages 2 & 5 grant no skill

      const newlyUnlocked = [];
      toUnlock.forEach(type => {
        if (!skillUL[heroId].includes(type)) {
          skillUL[heroId].push(type);
          newlyUnlocked.push(type.charAt(0).toUpperCase() + type.slice(1) + ' Skill');
        }
      });

      if (newlyUnlocked.length > 0) {
        safeLocalStorage.setItem(skillKey, JSON.stringify(skillUL));

        // Show unlock notification on the result screen
        const heroName = (HEROES[heroId] && HEROES[heroId].name) || heroId;
        const notif = document.createElement('div');
        notif.style.cssText = `
          margin-top: 10px;
          padding: 10px 20px;
          background: rgba(240,192,64,0.15);
          border: 1px solid rgba(240,192,64,0.5);
          border-radius: 8px;
          font-family: 'Cinzel', serif;
          font-size: 0.85rem;
          color: #f0c040;
          letter-spacing: 1px;
          text-align: center;
        `;
        notif.innerHTML = `🔓 SKILL UNLOCKED: <strong>${newlyUnlocked.join(', ')}</strong><br>
          <span style="font-size:0.7rem;color:#aaa;font-family:'Rajdhani',sans-serif;">
            Now available for ${heroName}!
          </span>`;
        document.querySelector('.result-box').appendChild(notif);

        // Sync to server
        apiCall({ action: 'saveStory', userID: user.userID, chapter: ch, stage: st, stars: starsEarned });
      }
    })();

    // Figure out the next stage
    const curChapter = B.chapter;
    const curStage   = B.stage;
    const nextStage  = curStage + 1;
    const isFinalStage = curStage === 5; // stage 5 = boss, last in chapter
    const nextChapter  = isFinalStage ? curChapter + 1 : curChapter;
    const hasNextCh    = nextChapter <= 10;

    // Build story-mode buttons
    const btns = $('result-btns');
    if (!isFinalStage) {
      // There's a next stage in the same chapter
      btns.innerHTML = `
        <button class="rbtn gold" onclick="goNextStage(${nextChapter}, ${nextStage})">▶ NEXT STAGE</button>
        <button class="rbtn ghost" onclick="location.href='story.html'">📖 Story Map</button>
        <button class="rbtn ghost" onclick="location.href='dashboard.html'">🏠 Dashboard</button>`;
    } else if (hasNextCh) {
      // Cleared chapter boss — next chapter available
      btns.innerHTML = `
        <button class="rbtn gold" onclick="location.href='story.html'">📖 Next Chapter</button>
        <button class="rbtn ghost" onclick="location.href='dashboard.html'">🏠 Dashboard</button>
        <button class="rbtn ghost" onclick="location.href='leaderboard.html'">🏆 Leaderboard</button>`;
    } else {
      // Final chapter cleared
      btns.innerHTML = `
        <button class="rbtn gold" onclick="location.href='story.html'">👑 Story Complete!</button>
        <button class="rbtn ghost" onclick="location.href='dashboard.html'">🏠 Dashboard</button>
        <button class="rbtn ghost" onclick="location.href='leaderboard.html'">🏆 Leaderboard</button>`;
    }
  } else if (B.mode==='story' && !won) {
    // Lost in story mode — no "Play Again", retry same stage
    const btns = $('result-btns');
    btns.innerHTML = `
      <button class="rbtn gold" onclick="location.reload()">↺ RETRY STAGE</button>
      <button class="rbtn ghost" onclick="location.href='story.html'">📖 Story Map</button>
      <button class="rbtn ghost" onclick="location.href='dashboard.html'">🏠 Dashboard</button>`;
  }

  // ── OFFLINE-AWARE SCORE SUBMIT ────────────────────────────
  // Try to push the score to the server.
  // If offline (or server times out), queue it locally in
  // tenfold_pending_scores_<userID> so dashboard.html can
  // flush it the next time the player is online.
  (async function submitScore() {
    const payload = {
      action:      'addScore',
      userID:      user.userID,
      username:    user.username,
      heroID:      B.playerHeroId,
      heroName:    B.pHero.name,
      enemyHeroID: B.enemyHeroId,
      enemyName:   B.eHero.name,
      result:      outcome,
      chapter:     B.chapter,
      battleID:    battleID,
      battleDate:  battleDate
    };

    const PENDING_KEY = 'tenfold_pending_scores_' + user.userID;

    try {
      const res = await apiCall(payload);
      if (res && res.success) {
        // Server accepted — update the authoritative score from server response
        if (res.newTotalScore !== undefined) {
          user.totalScore = Math.max(0, parseInt(res.newTotalScore, 10) || 0);
          Game.login(user);
          safeLocalStorage.setItem(
            'tenfold_score_cache_' + user.userID,
            String(user.totalScore)
          );
        }
        // If there are previously queued pending scores, try to flush them now
        flushPendingScores();
      } else {
        // Server responded but failed (rare) — queue it
        queuePendingScore(payload);
      }
    } catch(e) {
      // Network error / offline — queue it
      queuePendingScore(payload);
    }

    function queuePendingScore(p) {
      const pending = JSON.parse(safeLocalStorage.getItem(PENDING_KEY) || '[]');
      // Avoid duplicates: same battle (same date + hero + result)
      p.battleDate = p.battleDate || new Date().toISOString();
      p.battleID   = p.battleID || ('BAT_' + user.userID + '_' + Date.now() + '_' + Math.floor(Math.random()*100000));
      p.pts        = won ? 100 : 10;
      const isDupe = pending.some(x => x.battleID === p.battleID);
      if (!isDupe) {
        pending.push(p);
        // Cap at 200 pending entries to avoid bloat
        const kept = pending.slice(-200);
        safeLocalStorage.setItem(PENDING_KEY, JSON.stringify(kept));

        // Offline total = last confirmed server score + queued points.
        const base = Math.max(0, parseInt(
          safeLocalStorage.getItem('tenfold_score_cache_' + user.userID) || '0', 10
        ) || 0);
        const queuedPoints = kept.reduce(
          (sum, item) => sum + (parseInt(item.pts, 10) || (item.result === 'win' ? 100 : 10)), 0
        );
        user.totalScore = base + queuedPoints;
        Game.login(user);
      }
    }
  })();
}

// ── NEXT STAGE HELPER ─────────────────────────────────────────
// Stores the next stage info and reloads battle.html directly —
// no trip back to story.html needed for sequential stages.
function goNextStage(chNum, stageNum) {
  safeSessionStorage.setItem('tenfold_story_autonext', JSON.stringify({ chNum, stageNum }));
  location.href = 'story.html';
}

function fleeBattle() {
  if (B.over) return;
  if (confirm('Flee the battle?')) { B.over=true; showResult('lose'); }
}

// ── FLUSH PENDING OFFLINE SCORES ─────────────────────────────
// Called after a successful server sync. Drains the local queue
// one-by-one, updating user.totalScore from each server response.
async function flushPendingScores() {
  const PENDING_KEY = 'tenfold_pending_scores_' + user.userID;
  const pending = JSON.parse(safeLocalStorage.getItem(PENDING_KEY) || '[]');
  if (pending.length === 0) return;

  const remaining = [];
  for (const p of pending) {
    try {
      const res = await apiCall(p);
      if (res && res.success) {
        // Update local score from server authoritative value
        if (res.newTotalScore !== undefined) {
          user.totalScore = Math.max(0, parseInt(res.newTotalScore, 10) || 0);
          Game.login(user);
          safeLocalStorage.setItem(
            'tenfold_score_cache_' + user.userID,
            String(user.totalScore)
          );
        }
        // Also sync the hero level for this pending battle
        if (p.heroID) {
          const lvls = JSON.parse(safeLocalStorage.getItem('tenfold_levels_' + user.userID) || '{}');
          const lv   = lvls[p.heroID] || 1;
          const xp   = lvls[p.heroID + '_xp'] || 0;
          apiCall({ action: 'setHeroLevel', userID: user.userID, heroID: p.heroID, level: lv, xp: xp });
        }
      } else {
        remaining.push(p); // still failed — keep in queue
      }
    } catch(e) {
      remaining.push(p); // still offline — keep in queue
      break; // no point trying the rest
    }
  }

  if (remaining.length !== pending.length) {
    safeLocalStorage.setItem(PENDING_KEY, JSON.stringify(remaining));
  }
}

// ── ROLL CARD UPDATE ─────────────────────────────────────────
function setRollCard(side, heroId) {
  const h = HEROES[heroId]; if (!h) return;
  const imgEl   = $(`roll-${side}-img`);
  const emojiEl = $(`roll-${side}-emoji`);
  const nameEl  = $(`roll-${side}-name`);
  const subEl   = $(`roll-${side}-sub`);

  const portSrc = (h.sprites&&h.sprites.portrait)||(h.sprites&&h.sprites.idle)||'';
  if (imgEl) {
    imgEl.src = portSrc;
    imgEl.style.display = portSrc ? 'block' : 'none';
  }
  if (emojiEl) emojiEl.textContent = portSrc ? '' : (ELEMENT_ICONS[h.element]||'⚔');
  if (nameEl)  nameEl.textContent  = h.name;
  if (subEl)   subEl.textContent   = `${ELEMENT_ICONS[h.element]||''} ${h.element} · ${h.title}`;
}

// ── ROLL IDs (player card uses p, enemy uses e) ───────────────
// HTML ids: roll-p-img, roll-p-emoji, roll-p-name, roll-p-sub
//           roll-e-img, roll-e-emoji, roll-e-name, roll-e-sub
function updateRollCard(side, entityId) {
  // side = 'p' or 'e'  — works for both heroes and story enemies/mobs
  const h = getEntity(entityId); if (!h) return;
  const imgEl   = $('roll-'+side+'-img');
  const emojiEl = $('roll-'+side+'-emoji');
  const nameEl  = $('roll-'+side+'-name');
  const subEl   = $('roll-'+side+'-sub');

  const portSrc = (h.sprites&&h.sprites.portrait)||(h.sprites&&h.sprites.idle)||'';
  if (imgEl) { imgEl.src=portSrc; imgEl.style.display=portSrc?'block':'none'; }
  if (emojiEl) emojiEl.textContent = portSrc ? '' : (ELEMENT_ICONS[h.element]||'👾');
  if (nameEl)  nameEl.textContent  = h.name;
  // Show role badge for mobs (Monster/Boss), title for heroes
  const roleTag = (h.role && h.role !== 'Damage Dealer' && h.role !== 'Tank' && h.role !== 'Support / Damage' && h.role !== 'Assassin' && h.role !== 'Mage')
    ? h.role : h.title || '';
  if (subEl) subEl.textContent = `${ELEMENT_ICONS[h.element]||''} ${h.element} · ${roleTag}`;
}

// ── DO ROLL ──────────────────────────────────────────────────
async function doRoll() {
  $('roll-status').textContent = 'LOADING HERO DATA…';

  // ── FAST SERVER SYNC (never block the whole battle) ───────
  // Use cached progress immediately. If the server answers quickly,
  // merge its latest hero levels before the roll finishes. If mobile
  // WebView/network is slow, the battle continues with the last synced data.
  const levelSync = (async () => {
    try {
      const charsRes = await apiCall({ action: 'getChars', userID: user.userID }, 1600);
      if (charsRes.success && charsRes.characters) {
        const lvls = JSON.parse(safeLocalStorage.getItem('tenfold_levels_'+user.userID)||'{}');
        charsRes.characters.forEach(c => {
          const servLv = c.level || 1;
          const servXP = c.xp || 0;
          const localLv = lvls[c.heroID] || 1;
          if (servLv > localLv || (servLv === localLv && servXP > (lvls[c.heroID+'_xp'] || 0))) {
            lvls[c.heroID] = servLv;
            lvls[c.heroID+'_xp'] = servXP;
          }
        });
        safeLocalStorage.setItem('tenfold_levels_'+user.userID, JSON.stringify(lvls));
      }
    } catch (_) {}
  })();

  $('roll-status').textContent = 'ROLLING COMBATANTS & MAP…';

  // In story mode the chapter forces a specific hero; in arena use the player's selection.
  const storyHeroId = safeSessionStorage.getItem('tenfold_battle_hero_id') || '';
  const modeEarly   = safeSessionStorage.getItem('tenfold_battle_mode') || 'arena';
  const pId = (modeEarly === 'story' && storyHeroId && HEROES[storyHeroId])
    ? storyHeroId
    : (Game.getSelectedHero() || 'aeron');
  rollPlayerHeroId = pId;

  // Only 'aeron' is free from the start. All other heroes are unlocked through
  // story progression. Read whatever is already saved — never overwrite with
  // a full list, or locked heroes would appear as available in the arena.
  const saved = JSON.parse(safeLocalStorage.getItem('tenfold_unlocked_'+user.userID)||'["aeron"]');
  const unlocked = Array.from(new Set(['aeron', ...saved]));
  safeLocalStorage.setItem('tenfold_unlocked_'+user.userID, JSON.stringify(unlocked));

  const mode       = safeSessionStorage.getItem('tenfold_battle_mode') || 'arena';
  const fixedEnemy = safeSessionStorage.getItem('tenfold_battle_enemy') || '';

  // ── ARENA SKILL-UNLOCK GATE ───────────────────────────────
  // Block arena (hero vs hero) if the selected hero hasn't had all
  // 3 skills unlocked via Story Mode yet. Admins always bypass this.
  if (mode !== 'story' && !Game.isAdmin()) {
    const skillUL    = JSON.parse(safeLocalStorage.getItem('tenfold_skills_' + user.userID) || '{}');
    const heroSkills = (skillUL[pId]) || [];
    const hasAll     = ['basic', 'special', 'ultimate'].every(t => heroSkills.includes(t));
    if (!hasAll) {
      const missing = ['basic', 'special', 'ultimate'].filter(t => !heroSkills.includes(t));
      const CH_HERO_NUM = {aeron:1,lyra:2,kael:3,riven:4,selene:5,draven:6,mira:7,orion:8,brutus:9,elysia:10};
      const _ach = CH_HERO_NUM[pId] || 1;
      const hints   = { basic: `Ch.${_ach} Stage 1`, special: `Ch.${_ach} Stage 3`, ultimate: `Ch.${_ach} Stage 4` };
      const needed  = missing.map(t => hints[t]).join(' · ');
      $('roll-status').textContent = `🔒 Arena Locked`;
      const overlay = $('roll-overlay');
      if (overlay) {
        const msg = document.createElement('div');
        msg.style.cssText = `
          margin-top: 18px;
          padding: 14px 22px;
          background: rgba(200,0,0,0.15);
          border: 1px solid rgba(200,0,0,0.45);
          border-radius: 10px;
          font-family: 'Rajdhani', sans-serif;
          font-size: 0.95rem;
          color: #ff8888;
          text-align: center;
          line-height: 1.6;
        `;
        msg.innerHTML = `<strong style="font-family:'Cinzel',serif;color:#ffaaaa;letter-spacing:1px;">🔒 ARENA LOCKED</strong><br>
          Your hero doesn't have all skills unlocked yet.<br>
          <span style="color:#aaa;font-size:0.85rem;">Complete Story Mode to unlock: <strong style="color:#f0c040;">${needed}</strong></span><br>
          <span style="color:#666;font-size:0.78rem;">Returning to Story Mode…</span>`;
        overlay.appendChild(msg);
      }
      setTimeout(() => { window.location.href = 'story.html'; }, 2800);
      return;
    }
  }

  // When entering arena mode, aggressively wipe any leftover story keys from
  // the in-memory safeSessionStorage so they can't bleed into the arena roll.
  if (mode !== 'story') {
    safeSessionStorage.removeItem('tenfold_battle_enemy');
    safeSessionStorage.removeItem('tenfold_battle_enemy_lv');
    safeSessionStorage.removeItem('tenfold_battle_chapter');
    safeSessionStorage.removeItem('tenfold_battle_stage');
    safeSessionStorage.removeItem('tenfold_battle_name');
    safeSessionStorage.removeItem('tenfold_battle_is_boss');
    safeSessionStorage.removeItem('tenfold_battle_hero_id');
  }

  // ══════════════════════════════════════════════════════════
  // STORY MODE — fixed enemy (mob or story hero), skip roll
  // Only enter story branch when mode is explicitly 'story'
  // AND fixedEnemy resolves to a known entity (hero or story mob).
  // This prevents stale sessionStorage from accidentally routing
  // an arena battle through the story path.
  // ══════════════════════════════════════════════════════════
  const isKnownEnemy = fixedEnemy && (!!STORY_ENEMIES[fixedEnemy] || !!HEROES[fixedEnemy]);
  if (mode === 'story' && isKnownEnemy) {
    const isStoryMonster = !!STORY_ENEMIES[fixedEnemy];
    const isStoryHero    = !!HEROES[fixedEnemy];

    if (isStoryMonster) {
      const monster = STORY_ENEMIES[fixedEnemy];
      rollEnemyHeroId = fixedEnemy;
      rollMap = { name: monster.name, bg: monster.sprites.backgrounds[0] || '' };
    } else if (isStoryHero) {
      rollEnemyHeroId = fixedEnemy;
      // Use the hero's own background as map
      const h = HEROES[fixedEnemy];
      const bg = (h.sprites && h.sprites.backgrounds && h.sprites.backgrounds[0]) || '';
      rollMap = { name: h.name + '\'s Domain', bg };
    } else {
      // Fallback — unknown enemy, treat as arena
      rollEnemyHeroId = unlocked.filter(id=>id!==pId)[0] || 'aeron';
      rollMap = MAPS[Math.floor(Math.random()*MAPS.length)];
    }

    updateRollCard('p', pId);
    updateRollCard('e', rollEnemyHeroId);
    $('roll-map').textContent = rollMap.name;
    $('roll-map').classList.remove('spinning');

    const pCard = $('roll-player');
    const eCard = $('roll-enemy');
    pCard.classList.remove('spinning'); pCard.classList.add('settled');
    eCard.classList.remove('spinning'); eCard.classList.add('settled');
    $('roll-status').textContent = '— READY —';
    await sleep(400);
    $('roll-start-btn').style.display = 'inline-block';
    return;
  }

  // ══════════════════════════════════════════════════════════
  // ARENA MODE — random hero enemy + random map from ALL heroes
  // Always heroes only, never story mobs
  // ══════════════════════════════════════════════════════════

  // Enemy pool: ALL heroes except the player's chosen hero
  // In arena mode, locked heroes are still valid opponents —
  // the lock only prevents the player from PLAYING AS them.
  const allHeroIds = Object.keys(HEROES);
  const enemyPool = allHeroIds.filter(id => id !== pId && HEROES[id]);
  if (!enemyPool.length) enemyPool.push(pId === 'aeron' ? 'lyra' : 'aeron');

  // Show player card immediately (settled)
  updateRollCard('p', pId);
  const pCard = $('roll-player');
  pCard.classList.remove('spinning');
  pCard.classList.add('settled');

  // Spin enemy + map for 2.4s
  const DUR = 1400, t0 = Date.now();
  const ticker = setInterval(() => {
    const rE = enemyPool[Math.floor(Math.random() * enemyPool.length)];
    const rM = MAPS[Math.floor(Math.random() * MAPS.length)];
    updateRollCard('e', rE);
    $('roll-map').textContent = rM.name;
    if (Date.now() - t0 > DUR - 300) clearInterval(ticker);
  }, 85);

  await sleep(DUR);
  clearInterval(ticker);

  // Settle final enemy + map
  rollEnemyHeroId = enemyPool[Math.floor(Math.random() * enemyPool.length)];
  rollMap         = MAPS[Math.floor(Math.random() * MAPS.length)];
  updateRollCard('e', rollEnemyHeroId);
  $('roll-map').textContent = rollMap.name;
  $('roll-map').classList.remove('spinning');

  await sleep(80);
  const eCard = $('roll-enemy');
  eCard.classList.remove('spinning');
  eCard.classList.add('settled');

  $('roll-status').textContent = '— READY —';
  await sleep(350);
  $('roll-start-btn').style.display = 'inline-block';
}

// ── CHAPTER STAGE LEVEL TABLE ────────────────────────────────
// Hero level required (= enemy level) for every stage in every chapter.
// St offsets from boss level: St1=-4, St2=-3, St3=-2, St4=-1, St5=0
// Boss levels: Ch1=5, Ch2=10, Ch3=15, Ch4=20, Ch5=25,
//              Ch6=30, Ch7=35, Ch8=40, Ch9=45, Ch10=50
const CHAPTER_BOSS_LV = { 1:5, 2:10, 3:15, 4:20, 5:25, 6:30, 7:35, 8:40, 9:45, 10:50 };
const STAGE_OFFSETS   = { 1:-4, 2:-3, 3:-2, 4:-1, 5:0 };
function getChapterStageLv(chNum, stageNum) {
  const bossLv = CHAPTER_BOSS_LV[chNum] || 10;
  return Math.max(1, bossLv + (STAGE_OFFSETS[stageNum] || 0));
}

// ── START BATTLE ─────────────────────────────────────────────
function startBattle() {
  const lvls     = JSON.parse(safeLocalStorage.getItem('tenfold_levels_'+user.userID)||'{}');
  const modeNow  = safeSessionStorage.getItem('tenfold_battle_mode') || 'arena';
  const chNow    = +safeSessionStorage.getItem('tenfold_battle_chapter') || 0;
  const stNow    = +safeSessionStorage.getItem('tenfold_battle_stage')   || 0;
  const isBossNow = safeSessionStorage.getItem('tenfold_battle_is_boss') === '1';

  let pLv = lvls[rollPlayerHeroId] || 1;

  // In story mode: every stage has a required minimum level that matches
  // the enemy level for that stage. Force the hero up to that minimum
  // before entering so hero and enemy are always equal-level going in.
  // (Level never goes DOWN — only up if stored value is lower.)
  if (modeNow === 'story' && chNow > 0 && stNow > 0) {
    const requiredLv = getChapterStageLv(chNow, stNow);
    if (requiredLv > pLv) {
      pLv = requiredLv;
      lvls[rollPlayerHeroId] = pLv;
      safeLocalStorage.setItem('tenfold_levels_' + user.userID, JSON.stringify(lvls));
      apiCall({ action:'setHeroLevel', userID:user.userID, heroID:rollPlayerHeroId, level:pLv, xp: lvls[rollPlayerHeroId+'_xp']||0 });
    }
  }

  // Story monsters use their fixed level from safeSessionStorage; others scale near player
  const fixedELv = +safeSessionStorage.getItem('tenfold_battle_enemy_lv');
  const eLv  = fixedELv || Math.max(1, pLv+rand(-1,1));

  initBattleState(rollPlayerHeroId, rollEnemyHeroId, rollMap, pLv, eLv);

  $('arena-bg').style.backgroundImage = `url('${rollMap.bg}')`;
  $('map-tag').textContent = rollMap.name;

  buildSprite('player', rollPlayerHeroId);
  buildSprite('enemy',  rollEnemyHeroId);
  loadSkillIcons(rollPlayerHeroId);

  // Hide roll overlay
  $('roll-overlay').style.display = 'none';

  renderHUD();
  logMsg(`⚔ ${B.pHero.name} VS ${B.eHero.name}`, 'ls');
  logMsg(`📍 ${rollMap.name}`, 'ls');
  const isMobile = window.innerWidth <= 700;
  logMsg(isMobile ? 'Tap skill buttons to fight!' : 'Q=Attack  W=Basic  E=Special  R=Ultimate', 'ls');
  B.turn='player'; renderHUD();
  // Reset auto state on each new battle
  autoPlay = false;
  const autoBtn = document.getElementById('btn-auto');
  if (autoBtn) { autoBtn.classList.remove('active'); autoBtn.textContent = '▶ AUTO'; }
}

// ── KEYBOARD ─────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (B.over||B.locked) return;
  if (e.key==='q'||e.key==='Q') useAttack();
  if (e.key==='w'||e.key==='W') useSkill('basic');
  if (e.key==='e'||e.key==='E') useSkill('special');
  if (e.key==='r'||e.key==='R') useSkill('ultimate');
});

// ── START ────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', ()=>{
  doRoll().catch(err=>{
    console.error('doRoll error:', err);
    $('roll-status').textContent = 'ERROR: '+err.message;
    $('roll-status').style.color = '#ff4444';
  });
});
</script>
